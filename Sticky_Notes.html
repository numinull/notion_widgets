        ]
      },
      undo: {
        limit: 40,            // board actions you can step back through
        toastMs: 6000         // how long the "Note deleted · Undo" toast stays
      },
      images: {
        maxSide: 1200,        // pasted images are scaled down to fit this (px)
        quality: 0.86,        // JPEG / WebP quality when re-encoding
        keepUnder: 160000,    // small images (data URL chars) are kept as they are
        keepGifUnder: 600000, // GIFs under this stay untouched (keeps animation)
        shrinkSavedOver: 400000 // saved images bigger than this get shrunk on load
      },
      pointerDedupeMs: 350,
      autoHeight: {
        durationMs: 220,      // how long a note takes to ease to its new height
        easing: "cubic-bezier(0.2, 0.8, 0.2, 1)"
      },
      saveDelayMs: 300,       // debounce for typing / slider / arrow-key saves
      liftDelayMs: 120,       // hold the top bar this long to pick a note up
      drag: {
        startDistance: 4,     // px the pointer must travel before a press becomes a drag
        edgeGap: 4,           // px kept between a note and the window edge
        swingPerSpeed: 9,     // degrees of swing per px/ms of sideways speed
        maxSwing: 7,          // degrees
        bendPerSpeed: 6,      // degrees of 3D bend per px/ms of speed
        maxBend: 5,           // degrees
        liftTilt: -2,         // degrees; matches the CSS lift in §CSS-13
        liftScale: 0.012,     // matches the CSS lift in §CSS-13
        spring: { stiffness: 0.14, damping: 0.78 },     // swing + bend (wobbly)
        liftSpring: { stiffness: 0.2, damping: 0.7 }    // rising / settling
      }
    };

    // URL parameters (see file header)
    const params = new URLSearchParams(window.location.search);
    const BOARD_ID = (params.get("id") || "default").replace(/[^\w-]/g, "").slice(0, 40) || "default";
    const STORAGE_KEY = `${CONFIG.storagePrefix}:${BOARD_ID}`;
    const LEGACY_STORAGE_KEY = CONFIG.storagePrefix;
    const ALLOW_RESIZE = params.get("resize") !== "false";
    const SCENE = params.get("scene") !== "off";        // desktop scene (§CSS-16)

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    /* ========================================================================
       §JS-2  SHARED DOM + NOTE REGISTRY
       Per-note elements live on each Note as note.el (see §JS-5).
       ======================================================================== */
    const shared = {
      board: document.getElementById("board"),
      template: document.getElementById("noteTemplate"),
      formatBubble: document.getElementById("formatBubble"),
      addNoteBtn: document.getElementById("addNoteBtn"),
      scatterBtn: document.getElementById("scatterBtn"),
      dock: document.getElementById("dock"),
      sceneBar: document.getElementById("sceneBar"),
      sceneTitle: document.getElementById("sceneTitle"),
      sceneCount: document.getElementById("sceneCount"),
      sceneClock: document.getElementById("sceneClock"),
      ambientWash: document.getElementById("ambientWash"),
      searchBtn: document.getElementById("searchBtn"),
      sceneSearchBtn: document.getElementById("sceneSearchBtn"),
      palette: document.getElementById("palette"),
      paletteInput: document.getElementById("paletteInput"),
      paletteList: document.getElementById("paletteList"),
      toast: document.getElementById("toast"),
      toastText: document.getElementById("toastText"),
      toastAction: document.getElementById("toastAction"),
      toastClose: document.getElementById("toastClose"),
      saveStatus: document.getElementById("saveStatus"),
      backupInput: document.getElementById("backupInput")
    };

    const notes = [];               // every Note on the board (creation order)
    let activeNote = null;          // last note pressed or focused

    function noteFromNode(node) {
      return notes.find((note) => note.el.noteBody.contains(node)) || null;
    }

    function topZ() {
      return notes.reduce((max, note) => Math.max(max, note.state.z), 0);
    }

    // Stacking order as drawn: pinned notes sit a whole layer above the rest.
    function effectiveZ(note) {
      return note.state.z + (note.state.pinned ? CONFIG.pinLayer : 0);
    }

    function topmostNote() {
      return notes.reduce((top, note) => (!top || effectiveZ(note) > effectiveZ(top) ? note : top), null);
    }

    /* ========================================================================
       §JS-3  BOARD STATE + STORAGE
       Saved as one JSON value:  { version: 2, notes: [noteState, ...] }
       noteState shape:
         { id, bodyHtml, title, theme, font, highlight, opacity,
           collapsed, size, position, z, tilt, stack, pinned }
       Notes in one stack share a stack id and the same position (the pile's
       spot); their order in the pile is their z order.
       Older single-note saves are converted into a one-note board on load.

       Three ways to save (see PERFORMANCE RULES in the file header):
         saveState(note) that note's body DOM changed -> re-read it, write now
         saveSettings()  settings changed -> re-read only bodies with pending
                         typing, write now
         scheduleSave()  high-frequency changes -> write once things go quiet
       ======================================================================== */
    let saveTimer = 0;

    function makeNoteId() {
      return `note-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    }

    function createNoteState(overrides = {}) {
      return {
        id: makeNoteId(),
        bodyHtml: "",
        title: CONFIG.defaultTitle,
        theme: CONFIG.defaults.theme,
        font: CONFIG.defaults.font,
        highlight: CONFIG.defaults.highlight,
        opacity: CONFIG.defaults.opacity,
        collapsed: false,
        size: null,
        position: null,          // { x, y } px offset from the default spot
        z: 1,                    // stacking order; higher is on top
        tilt: randomTilt(),      // resting lean in degrees (desktop scene)
        stack: null,             // id shared by notes piled together (§JS-11b)
        pinned: false,           // kept above all unpinned notes (§CSS-20)
        ...overrides
      };
    }

    function normalizeNoteState(raw, index) {
      if (!raw || typeof raw !== "object") return null;
      // Very old saves stored a list of items instead of HTML.
      const bodyHtml = makeCheckboxesClickable(Object.prototype.hasOwnProperty.call(raw, "bodyHtml")
        ? String(raw.bodyHtml ?? "")
        : migrateItemsToBody(raw.items, raw.image));
      const z = Number(raw.z);
      const tilt = Number(raw.tilt);
      const id = typeof raw.id === "string" && raw.id ? raw.id : makeNoteId();

      return {
        id,
        bodyHtml,
        title: raw.title || CONFIG.defaultTitle,
        theme: raw.theme || CONFIG.defaults.theme,
        font: raw.font || CONFIG.defaults.font,
        highlight: raw.highlight || CONFIG.defaults.highlight,
        opacity: normalizeOpacity(raw.opacity),
        collapsed: Boolean(raw.collapsed),
        size: normalizeSize(raw.size),
        position: normalizePosition(raw.position),
        z: Number.isFinite(z) ? z : index + 1,
        // Older saves have no tilt: derive a steady one from the id
        tilt: Number.isFinite(tilt) ? clamp(tilt, -6, 6) : tiltFromId(id),
        stack: typeof raw.stack === "string" && raw.stack ? raw.stack : null,
        pinned: Boolean(raw.pinned)
      };
    }

    function randomTilt() {
      const max = CONFIG.scene.maxTilt;
      return Math.round((Math.random() * 2 - 1) * max * 10) / 10;
    }

    function tiltFromId(id) {
      let hash = 0;
      for (const char of id) hash = (hash * 31 + char.charCodeAt(0)) | 0;
      const max = CONFIG.scene.maxTilt;
      return Math.round(((Math.abs(hash) % 1000) / 1000 * 2 - 1) * max * 10) / 10;
    }

    function starterNoteStates() {
      return CONFIG.scene.starterNotes.map((starter, index) => createNoteState({
        theme: starter.theme,
        title: starter.title,
        bodyHtml: starter.items
          ? migrateItemsToBody(CONFIG.defaultItems)
          : starter.body.replaceAll("{checkbox}", CHECKBOX_HTML),
        z: index + 1
      }));
    }

    let isFreshBoard = false;

    function loadBoard() {
      const saved = readStoredState();
      let states;
      if (!saved) {
        isFreshBoard = true;
        states = SCENE
          ? starterNoteStates()
          : [createNoteState({ bodyHtml: migrateItemsToBody(CONFIG.defaultItems) })];
      } else if (Array.isArray(saved.notes)) {
        states = saved.notes.map(normalizeNoteState).filter(Boolean);
      } else {
        states = [normalizeNoteState(saved, 0)];          // single-note save
      }
      if (!states.length) states = [createNoteState()];

      // Ids must be unique; repair any duplicates.
      const seen = new Set();
      states.forEach((state) => {
        if (seen.has(state.id)) state.id = makeNoteId();
        seen.add(state.id);
      });
      return states;
    }

    function writeBoard() {
      writeStoredState({ version: 2, notes: notes.map((note) => note.state) });
    }

    function syncDirtyBodies() {
      notes.forEach((note) => {
        if (note.bodyDirty) note.syncBody();
      });
    }

    function cancelScheduledSave() {
      if (!saveTimer) return;
      window.clearTimeout(saveTimer);
      saveTimer = 0;
    }

    function saveState(note) {
      cancelScheduledSave();
      note.syncBody();
      syncDirtyBodies();
      writeBoard();
    }

    function saveSettings() {
      cancelScheduledSave();
      syncDirtyBodies();
      writeBoard();
    }

    function scheduleSave() {
      cancelScheduledSave();
      saveTimer = window.setTimeout(() => {
        saveTimer = 0;
        saveSettings();
      }, CONFIG.saveDelayMs);
    }

    // Writes anything still waiting on the debounce (used when the page hides).
    function flushPendingSave() {
      if (saveTimer || notes.some((note) => note.bodyDirty)) saveSettings();
    }

    function readStoredState() {
      try {
        const value = localStorage.getItem(STORAGE_KEY)
          || (BOARD_ID === "default" ? localStorage.getItem(LEGACY_STORAGE_KEY) : null);
        return value ? JSON.parse(value) : null;
      } catch (error) {
        return null;
      }
    }

    // Returns true when the save worked. A failed save is never silent: it
    // shows a warning with a backup download (§JS-3b).
    function writeStoredState(value) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
      } catch (error) {
        reportSaveProblem(isQuotaError(error) ? "full" : "blocked");
        return false;
      }
      if (saveProblem) clearSaveProblem();
      return true;
    }

    /* ========================================================================
       §JS-3b SAFE SAVING + BACKUPS
       Notes live in this browser's local storage (about 5MB). If a save
       fails (storage full, or blocked in this window) you get a warning
       that stays until it's fixed, a "Not saved" marker in the menu bar,
       and a one-click backup download. Pasted images are scaled down
       first (CONFIG.images) so they don't fill storage, and oversized
       images already saved get shrunk once on load.
       Backups: downloadBackup() / chooseBackupFile() (also in ⌘K search).
       ======================================================================== */
    let saveProblem = null;         // null | "full" | "blocked"
    let saveWarningShownAt = 0;

    function isQuotaError(error) {
      return Boolean(error) && (
        error.name === "QuotaExceededError"
        || error.name === "NS_ERROR_DOM_QUOTA_REACHED"
        || error.code === 22
        || error.code === 1014
      );
    }

    function reportSaveProblem(kind) {
      const changed = saveProblem !== kind;
      saveProblem = kind;
      document.documentElement.classList.add("has-save-problem");
      const showing = toastState.kind === "save";
      // Show it when it starts, and remind every 30s while it keeps failing.
      if (changed || (!showing && performance.now() - saveWarningShownAt > 30000)) showSaveWarning();
    }

    function showSaveWarning() {
      saveWarningShownAt = performance.now();
      const message = saveProblem === "full"
        ? "Changes aren't saving: this browser's storage is full. Remove some images, or download a backup."
        : "Changes can't be saved in this window. Download a backup to keep your notes.";
      showToast(message, { action: "Download backup", onAction: downloadBackup, tone: "warning", duration: 0, kind: "save" });
    }

    function clearSaveProblem() {
      saveProblem = null;
      document.documentElement.classList.remove("has-save-problem");
      showToast("Saving again. All changes saved.", { duration: 2600 });
    }

    // --- Backups ---------------------------------------------------------------
    function downloadBackup() {
      syncDirtyBodies();
      const data = {
        app: "do-not-forget",
        version: 2,
        board: BOARD_ID,
        exportedAt: new Date().toISOString(),
        notes: notes.map((note) => note.state)
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const day = new Date().toLocaleDateString("en-CA");      // YYYY-MM-DD, local
      link.href = url;
      link.download = `do-not-forget${BOARD_ID === "default" ? "" : `-${BOARD_ID}`}-${day}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 2000);
      if (!saveProblem) showToast("Backup downloaded", { duration: 2600 });
    }

    function chooseBackupFile() {
      shared.backupInput.value = "";
      shared.backupInput.click();
    }

    // Replaces the board with the notes in a backup file (undoable).
    async function restoreBackupFile(file) {
      if (!file) return;
      let list = null;
      try {
        const data = JSON.parse(await file.text());
        list = Array.isArray(data) ? data : data && Array.isArray(data.notes) ? data.notes : null;
      } catch (error) {
        list = null;
      }
      const states = (list || []).map(normalizeNoteState).filter(Boolean);
      if (!states.length) {
        showToast("That file isn't a do-not-forget backup.", { tone: "warning", duration: 4000 });
        return;
      }
      const seen = new Set();
      states.forEach((state) => {
        if (seen.has(state.id)) state.id = makeNoteId();
        seen.add(state.id);
      });
      recordUndo("Restore backup", { toast: `Restored ${states.length} ${states.length === 1 ? "note" : "notes"} from backup` });
      restoreBoard(states);
      tidyStacksOnLoad();
      normalizeZ();
      notes.forEach((note) => note.render());
      notes.forEach(keepNoteOnScreen);
      saveSettings();
    }

    // --- Image size --------------------------------------------------------------
    // Scales an image down to CONFIG.images.maxSide and re-encodes it.
    // JPEGs stay JPEG; anything else becomes WebP (keeps transparency), or PNG
    // where WebP isn't available. Returns the original if that's smaller.
    async function shrinkImageDataUrl(dataUrl, type = "") {
      const c = CONFIG.images;
      const mime = type || (dataUrl.match(/^data:([^;,]+)/) || [])[1] || "";
      if (mime === "image/gif" && dataUrl.length <= c.keepGifUnder) return dataUrl;
      if (mime === "image/svg+xml") return dataUrl;

      const image = new Image();
      image.decoding = "async";
      image.src = dataUrl;
      await image.decode();
      const width = image.naturalWidth;
      const height = image.naturalHeight;
      if (!width || !height) return dataUrl;
      const scale = Math.min(1, c.maxSide / Math.max(width, height));
      if (scale === 1 && dataUrl.length <= c.keepUnder) return dataUrl;

      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      const context = canvas.getContext("2d");
      context.imageSmoothingQuality = "high";
      context.drawImage(image, 0, 0, canvas.width, canvas.height);

      let out;
      if (mime === "image/jpeg") {
        out = canvas.toDataURL("image/jpeg", c.quality);
      } else {
        out = canvas.toDataURL("image/webp", c.quality);
        if (!out.startsWith("data:image/webp")) out = canvas.toDataURL("image/png");
      }
      return out.length < dataUrl.length ? out : dataUrl;
    }

    // Once after load: shrinks any oversized images saved before this existed.
    async function shrinkSavedImages() {
      let changed = false;
      for (const note of [...notes]) {
        const images = [...note.el.noteBody.querySelectorAll("img")]
          .filter((img) => img.src.startsWith("data:image") && img.src.length > CONFIG.images.shrinkSavedOver);
        for (const img of images) {
          try {
            const smaller = await shrinkImageDataUrl(img.src);
            if (smaller.length < img.src.length * 0.8 && notes.includes(note)) {
              img.src = smaller;
              note.syncBody();
              changed = true;
            }
          } catch (error) {
            // Couldn't decode it; leave it as it is.
          }
        }
      }
      if (changed) saveSettings();
    }

    function normalizeOpacity(opacity) {
      const value = Number(opacity);
      if (!Number.isFinite(value)) return CONFIG.defaults.opacity;
      return clamp(value, CONFIG.opacity.min, CONFIG.opacity.max);
    }

    function normalizeSize(size) {
      if (!size || typeof size !== "object") return null;
      const width = Number(size.width);
      const height = Number(size.height);
      if (!Number.isFinite(width) || !Number.isFinite(height)) return null;
      return {
        width: clamp(width, CONFIG.size.minWidth, CONFIG.size.savedMaxWidth),
        height: clamp(height, CONFIG.size.minHeight, CONFIG.size.savedMaxHeight)
      };
    }

    function normalizePosition(position) {
      if (!position || typeof position !== "object") return null;
      const x = Number(position.x);
      const y = Number(position.y);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
      return { x, y };
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    /* ========================================================================
       §JS-4  HTML + DOM HELPERS
       ======================================================================== */
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/"/g, "&quot;");
    }

    // Strips scripts, event handlers, inline styles and classes before saving.
    function cleanBodyHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = html;
      template.content.querySelectorAll("script, style, iframe, object, embed").forEach((node) => node.remove());
      template.content.querySelectorAll("*").forEach((node) => {
        [...node.attributes].forEach((attribute) => {
          if (attribute.name.startsWith("on")) node.removeAttribute(attribute.name);
          if (attribute.name === "style" || attribute.name === "class") node.removeAttribute(attribute.name);
        });
      });
      return template.innerHTML;
    }

    // Checkboxes are marked non-editable so they can be ticked in every
    // browser (Firefox ignores clicks on form controls inside editable text).
    const CHECKBOX_HTML = '<input type="checkbox" contenteditable="false">';

    function makeCheckboxesClickable(html) {
      return html.replace(/<input(?![^>]*\bcontenteditable=)([^>]*\btype="checkbox")/g, '<input contenteditable="false"$1');
    }

    // Image markup for pasted pictures. decoding="async" keeps large images
    // from blocking the page while they decode.
    function imageHtml(src) {
      return `<img src="${escapeAttribute(src)}" alt="Pasted note attachment" decoding="async">`;
    }

    // Converts old { items, image } saves into body HTML.
    function migrateItemsToBody(items, image) {
      const lines = Array.isArray(items) ? items : CONFIG.defaultItems;
      const textHtml = lines
        .map((item) => escapeHtml(item.text || ""))
        .filter(Boolean)
        .map((text) => `<div>${text}</div>`)
        .join("");
      return `${textHtml}${image ? imageHtml(image) : ""}`;
    }

    // Guarded writes: skip the DOM when nothing would change.
    function setText(node, text) {
      if (node.textContent !== text) node.textContent = text;
    }

    function setShown(node, shown) {
      const display = shown ? "flex" : "none";
      if (node.style.display !== display) node.style.display = display;
    }

    /* ========================================================================
       §JS-5  NOTE
       One instance per sticky note. Builds its DOM from #noteTemplate,
       renders its own state, and handles its own menu commands.
       To add a menu command: add a button with data-ref in the template
       (§HTML-1), list it in `this.el`, write a method below, and bind it in
       bindEvents().
       ======================================================================== */
    class Note {
      constructor(state) {
        this.state = state;
        this.bodyDirty = false;         // typed in since state.bodyHtml was synced
        this.applied = { theme: null, opacity: null, size: null, position: null, z: null, tilt: null };
        this.opacityFrame = 0;

        const fragment = shared.template.content.cloneNode(true);
        const widget = fragment.querySelector(".widget");
        const ref = (name) => widget.querySelector(`[data-ref="${name}"]`);
        this.el = {
          widget,
          note: ref("note"),
          header: ref("header"),
          titleArea: ref("titleArea"),
          titleText: ref("titleText"),
          count: ref("count"),
          menu: ref("menu"),
          menuBtn: ref("menuBtn"),
          opacitySlider: ref("opacitySlider"),
          checklistBtn: ref("checklistBtn"),
          clearImageBtn: ref("clearImageBtn"),
          newNoteBtn: ref("newNoteBtn"),
          resetPositionBtn: ref("resetPositionBtn"),
          collapseBtn: ref("collapseBtn"),
          clearBtn: ref("clearBtn"),
          deleteBtn: ref("deleteBtn"),
          unstackBtn: ref("unstackBtn"),
          pinBtn: ref("pinBtn"),
          pinMenuBtn: ref("pinMenuBtn"),
          pinMenuLabel: ref("pinMenuLabel"),
          collapseLabel: ref("collapseLabel"),
          clearImageLabel: ref("clearImageLabel"),
          opacityValue: ref("opacityValue"),
          stackBadge: ref("stackBadge"),
          noteBody: ref("noteBody"),
          resizeHandle: ref("resizeHandle"),
          bendShadeX: ref("bendShadeX"),
          bendShadeY: ref("bendShadeY")
        };

        shared.board.appendChild(fragment);
        this.bodyHeight = null;         // last measured text height (§JS-9b)
        this.heightAnimation = null;
        this.bindEvents();
        this.render();
        bodySizeObserver.observe(this.el.noteBody);
      }

      // --- State <-> screen ---------------------------------------------------
      syncBody() {
        this.state.bodyHtml = cleanBodyHtml(this.el.noteBody.innerHTML);
        this.bodyDirty = false;
      }

      // Pushes state onto the page. Every write is guarded, so calling render()
      // when little has changed costs almost nothing. The body is only replaced
      // when its saved HTML differs from the screen and it isn't being typed in.
      render() {
        const { el, state } = this;
        if (this.bodyDirty) this.syncBody();

        this.applyTheme();
        const className = [
          "note",
          `font-${state.font || CONFIG.defaults.font}`,
          state.collapsed ? "is-collapsed" : ""
        ].filter(Boolean).join(" ");
        if (el.note.className !== className) el.note.className = className;

        this.applyOpacity();
        this.applySize();
        this.applyZ();
        this.applyStackState();         // also applies position + tilt

        if (document.activeElement !== el.noteBody) {
          const bodyHtml = state.bodyHtml || "";
          if (el.noteBody.innerHTML !== bodyHtml) {
            el.noteBody.innerHTML = bodyHtml;
            syncCheckedLines(el.noteBody);
          }
        }

        // Rewrite the title if the text differs or editing left extra elements behind.
        const title = state.title || "";
        if (el.titleText.textContent !== title || el.titleText.childElementCount) {
          el.titleText.textContent = title;
        }

        setText(el.count, "");
        setText(el.collapseLabel, state.collapsed ? "Expand" : "Collapse");
        const imageCount = el.noteBody.querySelectorAll("img").length;
        setShown(el.clearImageBtn, imageCount > 0);
        setText(el.clearImageLabel, imageCount > 1 ? "Remove images" : "Remove image");
        setShown(el.resetPositionBtn, state.position && !state.stack);
        setShown(el.deleteBtn, notes.length > 1);

        const sliderValue = String(Math.round((state.opacity || CONFIG.defaults.opacity) * 100));
        if (el.opacitySlider.value !== sliderValue) el.opacitySlider.value = sliderValue;
        setText(el.opacityValue, `${sliderValue}%`);

        // Current colour and font are "checked" in the menu
        el.menu.querySelectorAll("[data-theme]").forEach((button) => {
          const checked = String(button.dataset.theme === state.theme);
          if (button.getAttribute("aria-checked") !== checked) button.setAttribute("aria-checked", checked);
        });
        el.menu.querySelectorAll("[data-font]").forEach((button) => {
          const checked = String(button.dataset.font === (state.font || CONFIG.defaults.font));
          if (button.getAttribute("aria-checked") !== checked) button.setAttribute("aria-checked", checked);
        });
      }

      // Theme class goes on .widget so the note AND its shadow layers share the
      // theme's colours. "theme-rose" has no CSS; it uses the :root tokens.
      // classList (not className) keeps the lift/drag classes intact.
      applyTheme() {
        const themeClass = `theme-${this.state.theme}`;
        if (themeClass === this.applied.theme) return;
        if (this.applied.theme) this.el.widget.classList.remove(this.applied.theme);
        this.el.widget.classList.add(themeClass);
        this.applied.theme = themeClass;
      }

      // Opacity is per note: set on this .widget (where --note-bg is defined).
      applyOpacity() {
        const value = String(normalizeOpacity(this.state.opacity));
        if (value === this.applied.opacity) return;
        this.applied.opacity = value;
        this.el.widget.style.setProperty("--note-opacity", value);
      }

      // Slider input can fire several times per frame; apply once per frame.
      scheduleOpacity() {
        if (this.opacityFrame) return;
        this.opacityFrame = window.requestAnimationFrame(() => {
          this.opacityFrame = 0;
          this.applyOpacity();
        });
      }

      // Size vars live on .widget so a resize only restyles this note.
      applySize() {
        const { size, collapsed } = this.state;
        const key = !size || collapsed ? "" : `${size.width}x${size.height}`;
        if (key === this.applied.size) return;
        this.applied.size = key;

        const style = this.el.widget.style;
        if (!key) {
          style.removeProperty("--widget-width");
          style.removeProperty("--note-height");
          return;
        }
        style.setProperty("--widget-width", `${size.width}px`);
        style.setProperty("--note-height", `${size.height}px`);
      }

      // Position is a `translate` on .widget (composited; no layout).
      // visualPlacement() adds pile / fan offsets for notes in a stack.
      applyPosition() {
        const { position, stack } = this.state;
        const placement = visualPlacement(this);
        const value = position || stack ? `${placement.x}px ${placement.y}px` : "";
        if (value === this.applied.position) return;
        this.applied.position = value;
        this.el.widget.style.translate = value;
      }

      // Resting lean (or pile / fan angle). CSS applies it on the desktop
      // scene and to stacks, and straightens a note while it's focused or
      // held (§CSS-16, §CSS-17).
      applyTilt() {
        const value = `${visualPlacement(this).tilt}deg`;
        if (value === this.applied.tilt) return;
        this.applied.tilt = value;
        this.el.widget.style.setProperty("--tilt", value);
      }

      // Stack classes, the pile's count badge, and `inert` on closed piles so
      // a click fans the pile instead of editing a sheet. Then re-places the note.
      applyStackState() {
        const { el, state } = this;
        const inStack = Boolean(state.stack);
        const open = inStack && isInOpenFan(this);
        const members = inStack ? stackMembers(state.stack) : null;
        const isTop = inStack && members[members.length - 1] === this;
        const closed = inStack && !open;

        el.widget.classList.toggle("in-stack", inStack);
        el.widget.classList.toggle("stack-open", open);
        el.widget.classList.toggle("is-stack-top", isTop && closed);
        if (el.note.inert !== closed) el.note.inert = closed;
        if (isTop) setText(el.stackBadge, `${members.length}`);
        const label = isTop && closed ? `Stack of ${members.length} notes. Click to fan out.` : "Sticky note";
        if (el.widget.getAttribute("aria-label") !== label) el.widget.setAttribute("aria-label", label);
        setShown(el.unstackBtn, open);

        // Pinned state
        const pinned = Boolean(state.pinned);
        el.widget.classList.toggle("is-pinned", pinned);
        if (el.pinBtn.getAttribute("aria-pressed") !== String(pinned)) {
          el.pinBtn.setAttribute("aria-pressed", String(pinned));
          const label = pinned ? "Unpin" : "Pin on top";
          el.pinBtn.setAttribute("aria-label", label);
          el.pinBtn.title = label;
        }
        setText(el.pinMenuLabel, pinned ? "Unpin" : "Pin on top");

        this.applyPosition();
        this.applyTilt();
      }

      applyZ() {
        const value = String(effectiveZ(this));
        if (value === this.applied.z) return;
        this.applied.z = value;
        this.el.widget.style.zIndex = value;
      }

      // --- Commands (menu items, bubble) --------------------------------------
      setTheme(theme) {
        if (theme !== this.state.theme) recordUndo("Colour change");
        this.state.theme = theme;
        saveSettings();
        this.render();
        toggleMenu(this, false);
        scheduleAmbient();          // the desk wash follows the new colour
      }

      setFont(font) {
        if ((font || CONFIG.defaults.font) !== this.state.font) recordUndo("Font change");
        this.state.font = font || CONFIG.defaults.font;
        saveSettings();
        this.render();
        toggleMenu(this, false);
      }

      setOpacityPercent(percent) {
        this.state.opacity = normalizeOpacity(Number(percent) / 100);
        setText(this.el.opacityValue, `${Math.round(this.state.opacity * 100)}%`);
        this.scheduleOpacity();
        scheduleSave();
      }

      format(tagName) {
        formatSelection(this, tagName);
      }

      highlight(colour) {
        this.state.highlight = colour || CONFIG.defaults.highlight;
        formatSelection(this, "mark", { highlight: this.state.highlight });
      }

      insertCheckbox() {
        this.state.collapsed = false;
        this.render();
        focusEditableEnd(this.el.noteBody);
        insertHtml(this, `<div>${CHECKBOX_HTML} </div>`);
        toggleMenu(this, false);
      }

      clearImages() {
        const images = this.el.noteBody.querySelectorAll("img");
        recordUndo(images.length > 1 ? "Remove images" : "Remove image", {
          toast: images.length > 1 ? "Images removed" : "Image removed"
        });
        images.forEach((image) => image.remove());
        saveState(this);
        this.render();
        toggleMenu(this, false);
      }

      // Pin on top / unpin. A card in a stack leaves the stack first (pinned
      // notes don't stack). Pinned notes hang straight; unpinning lets the
      // note lean again.
      togglePin() {
        toggleMenu(this, false);
        const pin = !this.state.pinned;
        recordUndo(pin ? "Pin" : "Unpin");
        if (pin && this.state.stack) detachFromStack(this);
        this.state.pinned = pin;
        if (!pin && SCENE) this.state.tilt = randomTilt();
        bringToFront(this);
        this.render();
        activeNote = this;
        updateSceneBar();
        scheduleAmbient();
        saveSettings();
      }

      // From the ⋯ menu of a card in an open fan: it stays where it is, as its
      // own note, and the rest of the hand closes up.
      takeOffStack() {
        toggleMenu(this, false);
        recordUndo("Take off stack");
        detachFromStack(this);
        saveSettings();
      }

      resetPosition() {
        recordUndo("Reset position");
        this.state.position = null;
        saveSettings();
        this.render();
        toggleMenu(this, false);
      }

      toggleCollapse() {
        recordUndo(this.state.collapsed ? "Expand" : "Collapse");
        this.state.collapsed = !this.state.collapsed;
        saveSettings();
        this.render();
        toggleMenu(this, false);
      }

      clearNote() {
        const body = this.el.noteBody;
        if (body.textContent.trim() || body.querySelector("img, input")) {
          recordUndo("Clear note", { toast: "Note cleared" });
        }
        this.state.bodyHtml = "";
        this.el.noteBody.innerHTML = "";
        this.state.collapsed = false;
        saveState(this);
        this.render();
        toggleMenu(this, false);
        this.el.noteBody.focus();
      }

      // One click deletes; the toast's Undo (or ⌘Z / Ctrl Z) brings it back.
      requestDelete() {
        if (notes.length <= 1) return;
        toggleMenu(this, false);
        recordUndo("Delete note", { toast: "Note deleted" });
        removeNote(this);
      }

      updateTitleWhileTyping() {
        this.state.title = this.el.titleText.innerText.replace(/\n/g, " ");
        scheduleSave();
      }

      commitTitle() {
        this.state.title = this.el.titleText.innerText.trim() || CONFIG.defaultTitle;
        saveSettings();
        this.render();
      }

      // --- This note's event listeners ----------------------------------------
      bindEvents() {
        const el = this.el;

        // Pressing anywhere on a note makes it active and brings it to the front.
        // Capture phase, so it still runs when a control stops propagation.
        el.widget.addEventListener("pointerdown", () => activateNote(this, { toFront: true }), true);
        el.widget.addEventListener("focusin", () => activateNote(this));

        // Title
        el.titleText.addEventListener("input", () => {
          lastTextEditAt = performance.now();
          this.updateTitleWhileTyping();
        });
        el.titleText.addEventListener("blur", () => this.commitTitle());
        el.titleText.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === "Escape") {
            event.preventDefault();
            el.titleText.blur();
          }
        });
        el.titleArea.addEventListener("click", (event) => {
          if (event.target === el.titleText) return;
          event.preventDefault();
          focusEditableEnd(el.titleText);
        });

        // Menu open/close. Opened from the keyboard (a click with no pointer
        // press), focus moves into the menu; arrow keys move around it.
        bindControl(el.menuBtn, (event) => {
          toggleMenu(this);
          if (event && event.type === "click" && el.menu.classList.contains("is-open")) focusMenuItem(this, 0);
        });
        el.menu.addEventListener("mousedown", holdControl);   // dividers / padding keep focus too
        el.menu.addEventListener("keydown", (event) => handleMenuKeys(this, event));
        el.menu.parentElement.addEventListener("focusout", (event) => {
          // Tabbing out of the menu closes it.
          if (event.relatedTarget && !el.menu.parentElement.contains(event.relatedTarget)) toggleMenu(this, false);
        });

        // Opacity slider (stopPropagation lets the slider drag normally)
        el.opacitySlider.addEventListener("mousedown", (event) => event.stopPropagation());
        el.opacitySlider.addEventListener("pointerdown", (event) => event.stopPropagation());
        el.opacitySlider.addEventListener("input", () => this.setOpacityPercent(el.opacitySlider.value));

        // Data-attribute menu buttons
        el.menu.querySelectorAll("[data-theme]").forEach((button) => {
          bindControl(button, () => this.setTheme(button.dataset.theme));
        });
        el.menu.querySelectorAll("[data-font]").forEach((button) => {
          bindControl(button, () => this.setFont(button.dataset.font));
        });

        // Individual menu buttons
        bindControl(el.checklistBtn, () => this.insertCheckbox());
        bindControl(el.clearImageBtn, () => this.clearImages());
        bindControl(el.newNoteBtn, () => {
          toggleMenu(this, false);
          addNote(this);
        });
        bindControl(el.resetPositionBtn, () => this.resetPosition());
        bindControl(el.unstackBtn, () => this.takeOffStack());
        bindControl(el.pinMenuBtn, () => this.togglePin());
        bindControl(el.pinBtn, () => this.togglePin());
        bindControl(el.collapseBtn, () => this.toggleCollapse());
        bindControl(el.clearBtn, () => this.clearNote());
        bindControl(el.deleteBtn, () => this.requestDelete());

        // Body
        el.noteBody.addEventListener("input", () => {
          lastTextEditAt = performance.now();
          this.bodyDirty = true;
          scheduleSave();
        });
        el.noteBody.addEventListener("change", (event) => handleCheckboxChange(this, event));
        // Clicking the paper around the text (padding, empty space) puts the
        // cursor at the end of the note, like clicking a real sticky note.
        // In a fan, that's also how you pick a card to read.
        el.noteBody.parentElement.addEventListener("click", (event) => {
          if (event.target !== el.noteBody.parentElement) return;
          focusEditableEnd(el.noteBody);
        });

        // Lift + drag from the top bar; resize from the corner.
        // A closed pile is inert inside, so presses land on the widget itself:
        // a click fans it, a drag moves the whole pile.
        el.header.addEventListener("pointerdown", (event) => startPress(this, event));
        el.widget.addEventListener("pointerdown", (event) => {
          if (isClosedStack(this)) startPress(this, event);
        });
        el.resizeHandle.addEventListener("pointerdown", (event) => startResize(this, event));
        el.resizeHandle.addEventListener("keydown", (event) => handleResizeKeys(this, event));
      }
    }

    /* ========================================================================
       §JS-6  BOARD ACTIONS (add, delete, focus order)
       ======================================================================== */
    function activateNote(note, { toFront = false } = {}) {
      activeNote = note;
      scheduleAmbient();
      if (!toFront) return;
      // A closed pile comes forward as a whole, keeping its order.
      if (isClosedStack(note)) stackMembers(note.state.stack).forEach(bringToFront);
      else bringToFront(note);
    }

    function bringToFront(note) {
      const top = topZ();
      const sharesTop = notes.some((other) => other !== note && other.state.z === top);
      if (note.state.z === top && !sharesTop) return;
      note.state.z = top + 1;
      if (note.state.z > 1000) normalizeZ();      // keep numbers small
      note.applyZ();
      // Pile order is z order, so a closed pile re-arranges its sheets.
      if (note.state.stack && !isInOpenFan(note)) layoutStack(note.state.stack);
      scheduleSave();
    }

    // Renumbers stacking order 1..n, keeping the current order.
    function normalizeZ() {
      [...notes]
        .sort((a, b) => a.state.z - b.state.z)
        .forEach((note, index) => {
          note.state.z = index + 1;
          note.applyZ();
        });
    }

    // New notes copy the look of the note they came from and appear slightly
    // down-right of it, stepping further along if that spot is taken.
    function addNote(fromNote = activeNote) {
      recordUndo("New note");
      const source = fromNote ? fromNote.state : null;
      const note = new Note(createNoteState({
        theme: source ? source.theme : CONFIG.defaults.theme,
        font: source ? source.font : CONFIG.defaults.font,
        highlight: source ? source.highlight : CONFIG.defaults.highlight,
        opacity: source ? source.opacity : CONFIG.defaults.opacity,
        z: topZ() + 1
      }));
      notes.push(note);

      note.state.position = SCENE
        ? findScatterSpot(note, notes.filter((other) => other !== note))
        : findOpenSpot(note, (source && source.position) || { x: 0, y: 0 });
      note.applyPosition();
      activeNote = note;
      updateSceneBar();
      scheduleAmbient();

      appearNote(note);

      saveSettings();
      notes.forEach((each) => each.render());     // e.g. "Delete note" now shows
      focusEditableEnd(note.el.noteBody);
    }

    function findOpenSpot(note, start) {
      const box = measureWidgetBox(note);
      const step = CONFIG.newNoteOffset;
      const taken = (spot) => notes.some((other) => {
        if (other === note) return false;
        const pos = other.state.position || { x: 0, y: 0 };
        return Math.abs(pos.x - spot.x) < 8 && Math.abs(pos.y - spot.y) < 8;
      });

      let spot = clampPosition(start.x + step, start.y + step, box);
      for (let i = 2; taken(spot) && i < 30; i += 1) {
        spot = clampPosition(start.x + step * i, start.y + step * i, box);
        if (taken(spot)) {
          // Reached a window edge: wrap back toward the top-left and keep going.
          spot = clampPosition(start.x - step * (i - 1), start.y + step * (i % 6), box);
        }
      }
      return spot;
    }

    // Desktop scene: tries random spots and keeps the one furthest from the
    // other notes, so the desk fills evenly with a natural, unplanned look.
    function findScatterSpot(note, others) {
      const box = measureWidgetBox(note);
      const limits = positionLimits(box);
      const centres = others.map((other) => {
        const otherBox = measureWidgetBox(other);
        const pos = other.state.position || { x: 0, y: 0 };
        return {
          x: otherBox.left + pos.x + otherBox.width / 2,
          y: otherBox.top + pos.y + otherBox.height / 2
        };
      });

      let best = null;
      let bestScore = -Infinity;
      for (let i = 0; i < CONFIG.scene.scatterTries; i += 1) {
        const spot = {
          x: Math.round(limits.minX + Math.random() * (limits.maxX - limits.minX)),
          y: Math.round(limits.minY + Math.random() * (limits.maxY - limits.minY))
        };
        const cx = box.left + spot.x + box.width / 2;
        const cy = box.top + spot.y + box.height / 2;
        const score = centres.length
          ? Math.min(...centres.map((c) => Math.hypot(c.x - cx, c.y - cy)))
          : Math.random();
        if (score > bestScore) {
          bestScore = score;
          best = spot;
        }
      }
      return best || clampPosition(0, 0, box);
    }

    // Dock "scatter": every note gets a fresh spot and a fresh lean.
    function scatterNotes({ save = true, record = true } = {}) {
      if (!SCENE) return;
      if (press.dragging) return;
      if (record) recordUndo("Scatter", { toast: "Notes scattered" });
      closeMenus();
      hideFormatBubble();
      if (document.activeElement && document.activeElement.closest(".widget")) {
        document.activeElement.blur();            // so every note can lean again
      }
      closeFan();
      // Each pile moves as one; loose notes move on their own. Pinned notes
      // stay where they are, and everything else scatters around them.
      const units = [];
      const seen = new Set();
      notes.forEach((note) => {
        if (note.state.pinned) return;
        const key = note.state.stack || note.state.id;
        if (seen.has(key)) return;
        seen.add(key);
        units.push(unitOf(note));
      });
      const placed = notes.filter((note) => note.state.pinned);
      units
        .sort(() => Math.random() - 0.5)
        .forEach((unit) => {
          const lead = unit[unit.length - 1];
          const spot = findScatterSpot(lead, placed);
          unit.forEach((note) => {
            note.state.position = { ...spot };
            note.state.tilt = randomTilt();
          });
          unit.forEach((note) => note.render());
          placed.push(lead);
        });
      scheduleAmbient();
      if (save) saveSettings();
    }

    function removeNote(note) {
      if (notes.length <= 1) return;
      const stackId = note.state.stack;
      discardNote(note);
      if (stackId) cleanupStack(stackId);
      activeNote = topmostNote();
      updateSceneBar();
      scheduleAmbient();
      saveSettings();
      notes.forEach((each) => each.render());     // last note hides "Delete note"
    }

    // Takes a note off the board (cleanup + fade out). No saving; callers do that.
    function discardNote(note) {
      if (press.note === note) endPress();
      if (motionNote === note) finishMotion();
      if (openMenuNote === note) {
        openMenuNote = null;
        document.body.classList.remove("has-open-menu");
      }
      if (savedSelection.note === note) {
        savedSelection = { note: null, range: null };
        hideFormatBubble();
      }
      const stackId = note.state.stack;
      if (stackId && openFan && openFan.id === stackId) {
        openFan.order = openFan.order.filter((card) => card !== note);
      }
      if (dropTarget === note || dropCandidate === note) clearDropTracking();
      notes.splice(notes.indexOf(note), 1);
      bodySizeObserver.unobserve(note.el.noteBody);

      const widget = note.el.widget;
      if (reducedMotion.matches) {
        widget.remove();
      } else {
        widget.classList.add("is-leaving");
        window.setTimeout(() => widget.remove(), 200);
      }
    }

    // A note joining the board: fades in, and glides once it has settled.
    function appearNote(note) {
      if (!reducedMotion.matches) {
        note.el.widget.classList.add("is-entering");
        window.setTimeout(() => note.el.widget.classList.remove("is-entering"), 320);
      }
      window.requestAnimationFrame(() => note.el.widget.classList.add("is-ready"));
    }

    /* ========================================================================
       §JS-6b UNDO / REDO
       Board actions (delete, clear, scatter, move, resize, stack, pin, colour,
       font, collapse, new note, restore backup...) call recordUndo() just
       BEFORE they change anything. That saves a snapshot of every note's
       state; undo puts the board back to it. Typing inside a note keeps the
       browser's own text undo: ⌘Z / Ctrl Z goes to whichever happened last,
       your typing or the board action.
       Snapshots share each note's bodyHtml string (strings are never copied),
       so even notes with images cost little to keep.
       To make a new action undoable: call recordUndo("Label") before it.
       ======================================================================== */
    const history = { undo: [], redo: [] };
    let lastTextEditAt = 0;           // last time you typed in a title or body

    function cloneState(state) {
      return {
        ...state,
        position: state.position ? { ...state.position } : null,
        size: state.size ? { ...state.size } : null
      };
    }

    function captureBoard() {
      syncDirtyBodies();
      return notes.map((note) => cloneState(note.state));
    }

    // label: what the action is ("Delete note"). toast: message to show with
    // an Undo button (for actions that remove or rearrange things).
    function recordUndo(label, { toast = "", snapshot = null } = {}) {
      history.undo.push({ label, snapshot: snapshot || captureBoard(), at: performance.now() });
      if (history.undo.length > CONFIG.undo.limit) history.undo.shift();
      history.redo.length = 0;
      if (toast) showToast(toast, { action: "Undo", onAction: undo });
    }

    function undo() {
      const entry = history.undo.pop();
      if (!entry) {
        showToast("Nothing to undo", { duration: 1600 });
        return false;
      }
      history.redo.push({ label: entry.label, snapshot: captureBoard(), at: performance.now() });
      restoreBoard(entry.snapshot);
      showToast(`${entry.label} undone`, { action: "Redo", onAction: redo, duration: 4000 });
      return true;
    }

    function redo() {
      const entry = history.redo.pop();
      if (!entry) {
        showToast("Nothing to redo", { duration: 1600 });
        return false;
      }
      history.undo.push({ label: entry.label, snapshot: captureBoard(), at: performance.now() });
      restoreBoard(entry.snapshot);
      showToast(`${entry.label} redone`, { action: "Undo", onAction: undo, duration: 4000 });
      return true;
    }

    // Puts the board back to a list of note states: removes notes that
    // weren't there, brings back ones that were, and updates the rest.
    function restoreBoard(states) {
      if (press.active) endPress();
      finishMotion();
      closeMenus();
      closeFan();
      hideFormatBubble();
      if (paletteState.open) closePalette({ restoreFocus: false });
      const focused = document.activeElement;
      if (focused && focused.closest && focused.closest(".board")) focused.blur();

      const byId = new Map(notes.map((note) => [note.state.id, note]));
      const keep = new Set(states.map((state) => state.id));
      [...notes].forEach((note) => {
        if (!keep.has(note.state.id)) discardNote(note);
      });
      states.forEach((saved) => {
        const existing = byId.get(saved.id);
        if (existing) {
          existing.state = cloneState(saved);
          existing.bodyDirty = false;
        } else {
          const note = new Note(cloneState(saved));
          notes.push(note);
          appearNote(note);
        }
      });
      notes.forEach((note) => note.render());
      activeNote = topmostNote();
      updateSceneBar();
      scheduleAmbient();
      saveSettings();
    }

    // ⌘Z / Ctrl Z and ⌘⇧Z / Ctrl ⇧Z / Ctrl Y.
    function handleUndoKeys(event) {
      const mod = IS_MAC ? event.metaKey : event.ctrlKey;
      if (!mod || event.altKey) return;
      const key = event.key.toLowerCase();
      const isUndo = key === "z" && !event.shiftKey;
      const isRedo = (key === "z" && event.shiftKey) || (!IS_MAC && key === "y" && !event.shiftKey);
      if (!isUndo && !isRedo) return;
      if (paletteState.open) return;                    // the search field's own undo
      if (isTypingTarget(event.target)) {
        // Typing is more recent than the last board action: undo the typing.
        const stack = isUndo ? history.undo : history.redo;
        const top = stack[stack.length - 1];
        if (!top || lastTextEditAt > top.at) return;
      }
      event.preventDefault();
      if (isUndo) undo();
      else redo();
    }

    /* ========================================================================
       §JS-6c TOAST
       One message at a time at the bottom of the screen, optionally with a
       button (Undo, Redo, Download backup). Hovering it pauses the timer.
       duration: 0 keeps it until dismissed (used for save warnings).
       ======================================================================== */
    const toastState = { timer: 0, hideTimer: 0, onAction: null, duration: 0, kind: "" };

    function showToast(message, { action = "", onAction = null, tone = "", duration = CONFIG.undo.toastMs, kind = "" } = {}) {
      const toast = shared.toast;
      window.clearTimeout(toastState.timer);
      window.clearTimeout(toastState.hideTimer);
      setText(shared.toastText, message);
      shared.toastAction.hidden = !action;
      if (action) setText(shared.toastAction, action);
      toastState.onAction = onAction;
      toastState.duration = duration;
      toastState.kind = kind;
      toast.classList.toggle("is-warning", tone === "warning");
      toast.hidden = false;
      window.requestAnimationFrame(() => toast.classList.add("is-open"));
      if (duration) toastState.timer = window.setTimeout(hideToast, duration);
    }

    function hideToast() {
      window.clearTimeout(toastState.timer);
      toastState.onAction = null;
      toastState.kind = "";
      shared.toast.classList.remove("is-open");
      toastState.hideTimer = window.setTimeout(() => {
        shared.toast.hidden = true;
      }, 200);
    }

    function bindToastEvents() {
      bindControl(shared.toastAction, () => {
        const run = toastState.onAction;
        hideToast();
        if (run) run();
      });
      bindControl(shared.toastClose, () => hideToast());
      shared.toast.addEventListener("pointerenter", () => window.clearTimeout(toastState.timer));
      shared.toast.addEventListener("pointerleave", () => {
        if (!toastState.duration || shared.toast.hidden) return;
        toastState.timer = window.setTimeout(hideToast, 2500);
      });
    }

    /* ========================================================================
       §JS-7  MENU + CONTROL BINDING
       Only one note's menu is open at a time.
       ======================================================================== */
    let openMenuNote = null;

    function toggleMenu(note, force) {
      const menu = note.el.menu;
      const isOpen = menu.classList.contains("is-open");
      const shouldOpen = typeof force === "boolean" ? force : !isOpen;
      if (shouldOpen === isOpen) return;    // nothing to change

      if (shouldOpen && openMenuNote && openMenuNote !== note) toggleMenu(openMenuNote, false);
      if (shouldOpen) note.render();        // refresh items (e.g. "clear image") before showing
      menu.classList.toggle("is-open", shouldOpen);
      note.el.menuBtn.setAttribute("aria-expanded", String(shouldOpen));

      if (shouldOpen) {
        openMenuNote = note;
        placeMenu(note);
      } else {
        if (openMenuNote === note) openMenuNote = null;
        // Keyboard users: closing the menu returns focus to its button.
        if (menu.contains(document.activeElement)) note.el.menuBtn.focus({ preventScroll: true });
      }
      document.body.classList.toggle("has-open-menu", Boolean(openMenuNote));
    }

    // Fits the open menu on screen: opens below the ⋯ button, or above it when
    // there's more room there, and scrolls if it's still too tall.
    // (One layout read, only when the menu opens.)
    // Order of preference: below the button, above it, then slid up or down
    // so the whole menu fits on screen (like a macOS menu near an edge).
    // Only scrolls if the window itself is shorter than the menu.
    function placeMenu(note) {
      const { menu, menuBtn } = note.el;
      menu.classList.remove("opens-up");
      menu.style.maxHeight = "";
      menu.style.top = "";
      menu.style.right = "";
      menu.scrollTop = 0;

      const button = menuBtn.getBoundingClientRect();
      const fullHeight = menu.scrollHeight;
      const edgeGap = 8;
      const topLimit = sceneInsets.top + edgeGap;        // clear of the desktop menu bar
      const bottomLimit = window.innerHeight - edgeGap;
      const spaceBelow = bottomLimit - button.bottom;
      const spaceAbove = button.top - topLimit;

      if (fullHeight <= spaceBelow) return;
      if (fullHeight <= spaceAbove) {
        menu.classList.add("opens-up");
        return;
      }
      const room = bottomLimit - topLimit;
      if (fullHeight <= room) {
        // Slide it so it fits: start as low as possible, never past the edge.
        // It opens just left of the ⋯ button so it never covers the button.
        menu.style.right = "32px";
        const menuTopNow = menu.getBoundingClientRect().top;
        const wantedTop = Math.min(menuTopNow, bottomLimit - fullHeight);
        menu.style.top = `${menu.offsetTop + Math.round(wantedTop - menuTopNow)}px`;
        return;
      }
      const openUp = spaceAbove > spaceBelow;
      if (openUp) menu.classList.add("opens-up");
      menu.style.maxHeight = `${Math.max(120, Math.floor(openUp ? spaceAbove : spaceBelow))}px`;
    }

    // Menu items you can reach with the arrow keys, in order (visible only).
    function menuItems(note) {
      return [...note.el.menu.querySelectorAll("button, input")]
        .filter((item) => item.offsetParent !== null);
    }

    function focusMenuItem(note, index) {
      const items = menuItems(note);
      if (!items.length) return;
      items[(index + items.length) % items.length].focus({ preventScroll: false });
    }

    // ↑/↓ (and ←/→ outside the slider) move; Home/End jump; Esc closes.
    function handleMenuKeys(note, event) {
      const items = menuItems(note);
      const index = items.indexOf(document.activeElement);
      const onSlider = event.target.type === "range";
      let next = null;
      if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        toggleMenu(note, false);
        note.el.menuBtn.focus({ preventScroll: true });
        return;
      }
      if (event.key === "ArrowDown" || (event.key === "ArrowRight" && !onSlider)) next = index + 1;
      else if (event.key === "ArrowUp" || (event.key === "ArrowLeft" && !onSlider)) next = index - 1;
      else if (event.key === "Home") next = 0;
      else if (event.key === "End") next = items.length - 1;
      if (next === null) return;
      event.preventDefault();
      focusMenuItem(note, next);
    }

    function closeMenus() {
      if (openMenuNote) toggleMenu(openMenuNote, false);
    }

    // Stops a control press from stealing focus / the text selection.
    function holdControl(event) {
      event.preventDefault();
      event.stopPropagation();
    }

    // Runs `action` once per press, on pointerdown (fast, keeps focus and the
    // text selection). The same press also fires mousedown and click; those
    // are skipped. Keyboard (Enter/Space) only fires click, so it still works.
    // A second tap always counts, so quick double-taps (e.g. delete) register.
    function bindControl(control, action) {
      let pressed = false;        // this press already ran the action
      let pressedAt = 0;

      control.addEventListener("pointerdown", (event) => {
        holdControl(event);
        pressed = true;
        pressedAt = event.timeStamp;
        action(event);
      });
      control.addEventListener("mousedown", (event) => {
        holdControl(event);
        if (pressed && event.timeStamp - pressedAt < CONFIG.pointerDedupeMs) return;
        pressed = true;           // browsers without pointer events
        pressedAt = event.timeStamp;
        action(event);
      });
      control.addEventListener("click", (event) => {
        holdControl(event);
        if (pressed) {
          pressed = false;        // the click that ends this press
          return;
        }
        action(event);
      });
    }

    /* ========================================================================
       §JS-8  TEXT SELECTION + FORMATTING
       One shared format bubble serves every note; it acts on whichever note
       holds the remembered selection.
       ======================================================================== */
    let savedSelection = { note: null, range: null };
    let selectionFrame = 0;
    let bubbleOpen = false;
    let bubbleSize = null;        // measured once; the bubble never changes size
    let bubbleTransform = "";

    function focusEditableEnd(field) {
      field.focus();
      const range = document.createRange();
      range.selectNodeContents(field);
      range.collapse(false);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function noteOwningSelection(selection) {
      if (!selection || !selection.rangeCount) return null;
      return noteFromNode(selection.getRangeAt(0).commonAncestorContainer);
    }

    // selectionchange fires on every caret move; check at most once per frame.
    function scheduleSelectionCheck() {
      if (selectionFrame) return;
      selectionFrame = window.requestAnimationFrame(() => {
        selectionFrame = 0;
        rememberBodySelection();
      });
    }

    function rememberBodySelection() {
      const selection = window.getSelection();
      const note = noteOwningSelection(selection);
      if (!note) {
        hideFormatBubble();
        return;
      }
      if (selection.isCollapsed) return;
      savedSelection = { note, range: selection.getRangeAt(0).cloneRange() };
      positionFormatBubble(savedSelection.range);
    }

    function restoreBodySelection(note) {
      const selection = window.getSelection();
      note.el.noteBody.focus();
      selection.removeAllRanges();
      if (savedSelection.note === note && savedSelection.range) {
        selection.addRange(savedSelection.range);
        return true;
      }
      focusEditableEnd(note.el.noteBody);
      return false;
    }

    // Wraps the current selection in <tagName>. For "mark", options.highlight
    // picks the colour.
    function formatSelection(note, tagName, options = {}) {
      note.state.collapsed = false;
      restoreBodySelection(note);

      const selection = window.getSelection();
      if (noteOwningSelection(selection) !== note || selection.isCollapsed) return;

      const range = selection.getRangeAt(0);
      const wrapper = document.createElement(tagName);
      if (tagName === "mark") {
        wrapper.dataset.highlight = options.highlight || note.state.highlight || CONFIG.defaults.highlight;
      }
      wrapper.appendChild(range.extractContents());
      range.insertNode(wrapper);

      selection.removeAllRanges();
      const after = document.createRange();
      after.selectNodeContents(wrapper);
      after.collapse(false);
      selection.addRange(after);
      savedSelection = { note, range: after.cloneRange() };

      saveState(note);
      note.render();
      hideFormatBubble();
    }

    function bubbleNote() {
      return savedSelection.note || activeNote;
    }

    function showFormatBubble() {
      if (bubbleOpen) return;
      bubbleOpen = true;
      shared.formatBubble.classList.add("is-open");
    }

    function hideFormatBubble() {
      if (!bubbleOpen) return;
      bubbleOpen = false;
      shared.formatBubble.classList.remove("is-open");
    }

    // Reads the selection rect (one layout read), then moves the bubble with
    // a transform. The bubble's own size is measured only the first time.
    function positionFormatBubble(range) {
      const rect = range.getBoundingClientRect();
      if (!rect.width && !rect.height) return;

      showFormatBubble();
      if (!bubbleSize) {
        const measured = shared.formatBubble.getBoundingClientRect();
        bubbleSize = { width: measured.width, height: measured.height };
      }

      const left = clamp(rect.left + rect.width / 2 - bubbleSize.width / 2, 8, window.innerWidth - bubbleSize.width - 8);
      const top = clamp(rect.top - bubbleSize.height - 8, 8, window.innerHeight - bubbleSize.height - 8);
      const transform = `translate3d(${Math.round(left)}px, ${Math.round(top)}px, 0)`;
      if (transform === bubbleTransform) return;
      bubbleTransform = transform;
      shared.formatBubble.style.transform = transform;
    }

    /* ========================================================================
       §JS-9  BODY CONTENT (checkboxes, images, raw inserts)
       ======================================================================== */
    function insertHtml(note, html) {
      note.el.noteBody.focus();
      document.execCommand("insertHTML", false, html);
      saveState(note);
      note.render();
    }

    // Applies strike-through styling to lines whose checkbox is ticked.
    // Only writes attributes that are missing or wrong.
    function syncCheckedLines(body) {
      body.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
        const line = checkbox.closest("div");
        if (!line) return;
        if (checkbox.checked || checkbox.hasAttribute("checked")) {
          checkbox.checked = true;
          if (!checkbox.hasAttribute("checked")) checkbox.setAttribute("checked", "");
          if (line.dataset.checked !== "true") line.dataset.checked = "true";
        } else if (line.dataset.checked !== undefined) {
          delete line.dataset.checked;
        }
      });
    }

    function handleCheckboxChange(note, event) {
      if (!event.target.matches('input[type="checkbox"]')) return;
      event.target.toggleAttribute("checked", event.target.checked);
      const line = event.target.closest("div");
      if (line) {
        if (event.target.checked) {
          line.dataset.checked = "true";
        } else {
          delete line.dataset.checked;
        }
      }
      saveState(note);
    }

    // Pasted images are scaled down first so they don't fill storage (§JS-3b).
    function insertImageFile(note, file) {
      if (!file || !file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.addEventListener("load", async () => {
        const original = String(reader.result || "");
        let src = original;
        try {
          src = await shrinkImageDataUrl(original, file.type);
        } catch (error) {
          src = original;
        }
        if (!notes.includes(note)) return;      // deleted while the image loaded
        note.state.collapsed = false;
        note.render();
        focusEditableEnd(note.el.noteBody);
        insertHtml(note, imageHtml(src));
      });
      reader.readAsDataURL(file);
    }

    // Pasted images go into the note being pasted into (or the active note).
    function handlePasteImage(event) {
      if (shared.palette.contains(event.target)) return;   // pasting into the search box
      const items = Array.from(event.clipboardData?.items || []);
      const imageItem = items.find((item) => item.type.startsWith("image/"));
      if (!imageItem) return;
      const file = imageItem.getAsFile();
      if (!file) return;
      const note = noteFromNode(event.target) || activeNote || notes[0];
      if (!note) return;
      event.preventDefault();
      insertImageFile(note, file);
    }

    /* ========================================================================
       §JS-9b AUTO-HEIGHT
       Notes size themselves to their text (the CSS has no fixed height; the
       user's resize only sets a minimum). This makes the change smooth:
       one ResizeObserver watches every note's text, and when its height
       changes it animates .note-content from the old height to the new one.
       ResizeObserver runs after layout but before paint, so the jump is never
       seen. A note that would grow off the bottom of the screen glides up to
       stay in view; past the tallest the window allows, its text scrolls.
       No animation while resizing, dragging, collapsing, or with reduced
       motion; those just snap.
       ======================================================================== */
    const bodySizeObserver = new ResizeObserver((entries) => {
      entries.forEach((entry) => {
        const note = notes.find((each) => each.el.noteBody === entry.target);
        if (!note) return;
        const size = entry.borderBoxSize && entry.borderBoxSize[0];
        const height = size ? size.blockSize : entry.contentRect.height;
        easeToTextHeight(note, Math.round(height));
      });
    });

    function easeToTextHeight(note, newHeight) {
      const previous = note.bodyHeight;
      note.bodyHeight = newHeight;
      if (previous === null || previous === newHeight) return;
      if (!previous || !newHeight) return;            // collapsing / expanding

      const content = note.el.noteBody.parentElement;
      const busy = note.el.note.classList.contains("is-resizing")
        || note.el.widget.classList.contains("is-dragging")
        || !note.el.widget.classList.contains("is-ready")
        || reducedMotion.matches;

      // Where the box is right now (mid-animation if one is running)...
      let from;
      if (note.heightAnimation) {
        from = content.getBoundingClientRect().height;
        note.heightAnimation.cancel();
        note.heightAnimation = null;
      }
      // ...and where it's going (the natural height, already laid out).
      const to = content.offsetHeight;
      if (from === undefined) from = to - (newHeight - previous);

      // Grows past the bottom of the screen? Glide up to keep it in view.
      if (!note.state.stack) keepNoteOnScreen(note);

      const capped = content.scrollHeight > content.clientHeight + 1;   // scrolling inside
      if (busy || capped || Math.abs(to - from) < 1) return;

      content.classList.add("is-easing-height");
      const animation = content.animate(
        [{ height: `${from}px` }, { height: `${to}px` }],
        { duration: CONFIG.autoHeight.durationMs, easing: CONFIG.autoHeight.easing }
      );
      note.heightAnimation = animation;
      const done = () => {
        if (note.heightAnimation !== animation) return;
        note.heightAnimation = null;
        content.classList.remove("is-easing-height");
      };
      animation.addEventListener("finish", done);
      animation.addEventListener("cancel", () => {
        if (note.heightAnimation === null) content.classList.remove("is-easing-height");
      });
    }

    // Tallest a note may get: the window, minus the desktop bar and dock.
    let appliedMaxHeight = "";

    function updateNoteMaxHeight() {
      const gap = CONFIG.drag.edgeGap * 2;
      const value = `${Math.max(200, Math.floor(window.innerHeight - sceneInsets.top - sceneInsets.bottom - gap))}px`;
      if (value === appliedMaxHeight) return;
      appliedMaxHeight = value;
      document.documentElement.style.setProperty("--note-max-height", value);
    }

    /* ========================================================================
       §JS-10 RESIZE
       Pointer moves are collected and applied once per animation frame.
       ======================================================================== */
    function getDragLimits() {
      const s = CONFIG.size;
      return {
        maxWidth: Math.max(s.minWidth, Math.min(s.dragMaxWidth, window.innerWidth - s.viewportGutter)),
        maxHeight: Math.max(s.minHeight, Math.min(s.dragMaxHeight, window.innerHeight - s.viewportGutter))
      };
    }

    function startResize(note, event) {
      if (note.state.collapsed || !ALLOW_RESIZE) return;
      event.preventDefault();
      event.stopPropagation();
      closeMenus();

      const before = captureBoard();    // for undo
      const startSize = JSON.stringify(note.state.size);
      const noteRect = note.el.note.getBoundingClientRect();
      const startX = event.clientX;
      const startY = event.clientY;
      const startWidth = noteRect.width;
      const startHeight = noteRect.height;
      const { maxWidth, maxHeight } = getDragLimits();
      let pointerX = startX;
      let pointerY = startY;
      let frame = 0;

      note.el.note.classList.add("is-resizing");
      note.el.widget.classList.add("is-raised");
      document.body.classList.add("is-resizing-note");

      function applyPendingSize() {
        frame = 0;
        note.state.size = {
          width: clamp(startWidth + pointerX - startX, CONFIG.size.minWidth, maxWidth),
          height: clamp(startHeight + pointerY - startY, CONFIG.size.minHeight, maxHeight)
        };
        note.applySize();
      }

      function resize(moveEvent) {
        pointerX = moveEvent.clientX;
        pointerY = moveEvent.clientY;
        if (!frame) frame = window.requestAnimationFrame(applyPendingSize);
      }

      function finishResize() {
        if (frame) {
          window.cancelAnimationFrame(frame);
          applyPendingSize();
        }
        note.el.note.classList.remove("is-resizing");
        note.el.widget.classList.remove("is-raised");
        document.body.classList.remove("is-resizing-note");
        if (JSON.stringify(note.state.size) !== startSize) recordUndo("Resize", { snapshot: before });
        saveSettings();
        scheduleAmbient();
        window.removeEventListener("pointermove", resize);
        window.removeEventListener("pointerup", finishResize);
        window.removeEventListener("pointercancel", finishResize);
      }

      window.addEventListener("pointermove", resize);
      window.addEventListener("pointerup", finishResize);
      window.addEventListener("pointercancel", finishResize);
    }

    function handleResizeKeys(note, event) {
      if (note.state.collapsed || !ALLOW_RESIZE) return;
      const step = CONFIG.size.keyboardStep;
      const steps = {
        ArrowRight: [step, 0],
        ArrowLeft: [-step, 0],
        ArrowDown: [0, step],
        ArrowUp: [0, -step]
      };
      const delta = steps[event.key];
      if (!delta) return;
      event.preventDefault();
      event.stopPropagation();

      const rect = note.el.note.getBoundingClientRect();
      const { maxWidth, maxHeight } = getDragLimits();
      note.state.size = {
        width: clamp((note.state.size?.width || rect.width) + delta[0], CONFIG.size.minWidth, maxWidth),
        height: clamp((note.state.size?.height || rect.height) + delta[1], CONFIG.size.minHeight, maxHeight)
      };
      note.applySize();
      scheduleSave();
    }

    /* ========================================================================
       §JS-11 LIFT + DRAG + BEND
       Press a note's top bar (not the ⋯ button):
         - hold still for CONFIG.liftDelayMs  -> note lifts (CSS, §CSS-13)
         - move more than drag.startDistance  -> note lifts and follows you
       While dragging, a small spring simulation bends the paper:
         swing  .widget `rotate` around the grab point; the free end trails
                behind sideways movement like paper held by one spot
         bendY  3D tilt from sideways speed (trailing edge falls back)
         bendX  3D tilt from up/down speed (bottom edge lags)
         lift   rise/settle amount (1 = lifted)
       On release every target goes to 0, so the note wobbles back flat, then
       all inline styles are removed. One note is animated at a time
       (`motionNote`). Only transform-type properties and opacity change per
       frame, so no layout work happens while dragging.
       Visuals: §CSS-13 (shadows), §CSS-14 (drag + bend shading).
       ======================================================================== */
    const press = { note: null, active: false, pointerId: null, startX: 0, startY: 0, dragging: false };
    const drag = {
      unit: [],                    // notes moving together (one note, or a whole pile)
      noSwing: false,              // piles don't swing; only loose notes do
      box: null,                   // layout box measured once when a drag starts
      startOffsetX: 0, startOffsetY: 0,
      lastX: 0, lastY: 0, lastTime: 0, lastMoveTime: 0,
      vx: 0, vy: 0                 // smoothed pointer speed, px per ms
    };
    const springs = {
      swing: { x: 0, v: 0 },
      bendX: { x: 0, v: 0 },
      bendY: { x: 0, v: 0 },
      lift: { x: 0, v: 0 }
    };
    let liftTimer = 0;
    let motionFrame = 0;
    let motionNote = null;
    let appliedBend = "";
    let appliedSwing = "";

    // --- Pressing ---------------------------------------------------------
    function startPress(note, event) {
      if (event.button !== 0 || press.active) return;
      if (event.target.closest(".menu-area, .pin-btn")) return;

      // Pressing a closed pile holds the whole pile by its top sheet.
      press.stack = isClosedStack(note) ? note.state.stack : null;
      const held = press.stack ? stackMembers(press.stack) : [note];
      press.note = held[held.length - 1];
      press.active = true;
      press.pointerId = event.pointerId;
      press.startX = event.clientX;
      press.startY = event.clientY;
      press.dragging = false;

      liftTimer = window.setTimeout(() => {
        liftTimer = 0;
        held.forEach((each) => each.el.widget.classList.add("is-lifted"));
      }, CONFIG.liftDelayMs);

      window.addEventListener("pointermove", handlePressMove);
      window.addEventListener("pointerup", endPress);
      window.addEventListener("pointercancel", endPress);
    }

    function handlePressMove(event) {
      if (event.pointerId !== press.pointerId) return;
      if (!press.dragging) {
        const moved = Math.hypot(event.clientX - press.startX, event.clientY - press.startY);
        if (moved < CONFIG.drag.startDistance) return;
        beginDrag(event);
      }

      // Smoothed speed drives the bend
      const dt = Math.max(1, event.timeStamp - drag.lastTime);
      drag.vx = drag.vx * 0.6 + ((event.clientX - drag.lastX) / dt) * 0.4;
      drag.vy = drag.vy * 0.6 + ((event.clientY - drag.lastY) / dt) * 0.4;
      drag.lastX = event.clientX;
      drag.lastY = event.clientY;
      drag.lastTime = event.timeStamp;
      drag.lastMoveTime = event.timeStamp;

      const position = clampPosition(
        drag.startOffsetX + event.clientX - press.startX,
        drag.startOffsetY + event.clientY - press.startY,
        drag.box
      );
      drag.unit.forEach((each) => {
        each.state.position = { ...position };
      });
      requestMotionFrame();         // position, bend and drop target: once per frame
    }

    function beginDrag(event) {
      const note = press.note;
      drag.before = captureBoard();     // for undo, before anything moves
      press.dragging = true;
      if (liftTimer) {
        window.clearTimeout(liftTimer);
        liftTimer = 0;
      }
      if (motionNote && motionNote !== note) finishMotion();   // another note still wobbling
      const continuing = motionNote === note;
      motionNote = note;
      const wasLifted = note.el.widget.classList.contains("is-lifted");
      const stackDrag = Boolean(press.stack);

      // Read how the note sits right now, before anything changes, so the
      // drag can start from exactly that spot and angle.
      const sitting = getComputedStyle(note.el.widget);
      const currentRotate = parseFloat(sitting.rotate) || 0;
      const [originX, originY] = sitting.transformOrigin.split(" ").map(parseFloat);

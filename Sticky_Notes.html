      // A raised fan card is lifted along its own angle; carry that over too.
      const raised = new DOMMatrixReadOnly(sitting.transform === "none" ? undefined : sitting.transform);
      const turn = (currentRotate * Math.PI) / 180;
      const raisedX = Math.cos(turn) * raised.e - Math.sin(turn) * raised.f;
      const raisedY = Math.sin(turn) * raised.e + Math.cos(turn) * raised.f;

      // Dragging a card out of an open fan takes it off the stack.
      const leavingFan = isInOpenFan(note);
      if (leavingFan) detachFromStack(note);
      drag.unit = stackDrag ? stackMembers(press.stack) : [note];
      drag.noSwing = stackDrag;

      // Clicking the title focuses it; a drag shouldn't edit or select text.
      if (document.activeElement === note.el.titleText) note.el.titleText.blur();
      window.getSelection()?.removeAllRanges();
      hideFormatBubble();
      closeMenus();

      const offset = { ...(note.state.position || { x: 0, y: 0 }) };
      if (leavingFan) {
        offset.x += raisedX;
        offset.y += raisedY;
      }
      drag.box = measureWidgetBox(note);
      drag.lastX = event.clientX;
      drag.lastY = event.clientY;
      drag.lastTime = event.timeStamp;
      drag.lastMoveTime = event.timeStamp;
      drag.vx = 0;
      drag.vy = 0;

      // Swing around the spot you grabbed. Moving the pivot of a leaning note
      // would make it jump, so shift its position to cancel that out exactly.
      // (Not while it's still wobbling from a moment ago, and not for piles,
      // which keep their low "wrist" pivot.)
      if (!stackDrag && !continuing) {
        const pivotX = press.startX - (drag.box.left + offset.x);
        const pivotY = press.startY - (drag.box.top + offset.y);
        const angle = (currentRotate * Math.PI) / 180;
        const dx = originX - pivotX;
        const dy = originY - pivotY;
        offset.x = Math.round(offset.x + dx - (Math.cos(angle) * dx - Math.sin(angle) * dy));
        offset.y = Math.round(offset.y + dy - (Math.sin(angle) * dx + Math.cos(angle) * dy));
        note.el.widget.style.transformOrigin = `${Math.round(pivotX)}px ${Math.round(pivotY)}px`;
        note.state.position = { ...offset };
        note.applyPosition();
      }
      drag.startOffsetX = offset.x;
      drag.startOffsetY = offset.y;
      if (!continuing) {
        springs.lift.x = wasLifted ? 1 : 0;     // continue from the CSS lift
        // Start the swing from wherever the note is leaning right now
        // (its resting tilt, or partway through straightening).
        springs.swing.x = parseFloat(getComputedStyle(note.el.widget).rotate) || 0;
        springs.swing.v = 0;
      }

      drag.unit.forEach((each) => each.el.widget.classList.add("is-lifted", "is-dragging"));
      document.body.classList.add("is-dragging-note");
    }

    function endPress(event) {
      if (!press.active) return;
      if (event && event.pointerId !== undefined && event.pointerId !== press.pointerId) return;

      const note = press.note;
      press.active = false;
      press.note = null;
      if (liftTimer) {
        window.clearTimeout(liftTimer);
        liftTimer = 0;
      }
      window.removeEventListener("pointermove", handlePressMove);
      window.removeEventListener("pointerup", endPress);
      window.removeEventListener("pointercancel", endPress);
      const stackId = press.stack;
      press.stack = null;
      const held = stackId ? stackMembers(stackId) : [note];
      held.forEach((each) => each.el.widget.classList.remove("is-lifted"));

      if (!press.dragging) {
        if (stackId) openFanFor(note);   // a click on a pile fans it out
        return;
      }
      press.dragging = false;
      document.body.classList.remove("is-dragging-note");

      // Released over an armed target (ring showing)? Join it.
      const stillOver = event && event.clientX !== undefined
        ? dropFace(findDropTarget(event.clientX, event.clientY))
        : null;
      const target = dropTarget && stillOver === dropTarget ? dropTarget : null;
      clearDropTracking();
      const unit = drag.unit;
      drag.unit = [];
      unit.forEach((each) => {
        if (each !== note) each.el.widget.classList.remove("is-dragging");
      });
      swallowNextClick();           // the release shouldn't count as a title click

      scheduleAmbient();            // the wash drifts to where the note landed
      const before = drag.before;
      drag.before = null;
      if (before) recordUndo(target ? "Stack" : stackId ? "Move stack" : "Move", { snapshot: before });
      if (target) {
        stackOnto(unit, target);
        finishMotion();             // CSS glides it into the pile
        return;
      }
      // Dropped paper lands at a slightly new angle (desktop scene, loose notes).
      if (SCENE && !stackId && !note.state.pinned) {
        note.state.tilt = randomTilt();
        note.applyTilt();
      }
      saveSettings();
      requestMotionFrame();         // let the paper settle back flat
    }

    // After a drag, the browser fires a click on release; ignore that one.
    function swallowNextClick() {
      function swallow(event) {
        event.preventDefault();
        event.stopPropagation();
        stop();
      }
      function stop() {
        window.removeEventListener("click", swallow, true);
      }
      window.addEventListener("click", swallow, true);
      window.setTimeout(stop, 0);
    }

    // --- Position -----------------------------------------------------------
    // Layout box without any translate/rotate (offset* ignore transforms).
    // Every note's default spot is the same top-centre cell (§CSS-5).
    function measureWidgetBox(note) {
      const widget = note.el.widget;
      return {
        left: widget.offsetLeft - window.scrollX,
        top: widget.offsetTop - window.scrollY,
        width: widget.offsetWidth,
        height: widget.offsetHeight
      };
    }

    // Space taken by the desktop menu bar (top) and dock (bottom). Measured
    // on load and window resize only.
    const sceneInsets = { top: 0, bottom: 0 };

    function measureSceneInsets() {
      if (SCENE) {
        sceneInsets.top = shared.sceneBar.getBoundingClientRect().bottom;
        sceneInsets.bottom = window.innerHeight - shared.dock.getBoundingClientRect().top;
      }
      updateNoteMaxHeight();
    }

    // Where a note's offset may go so the whole note stays on screen and
    // clear of the menu bar and dock (or keeps its top-left corner on screen
    // if it's bigger than the space).
    function positionLimits(box) {
      const gap = CONFIG.drag.edgeGap;
      const minX = gap - box.left;
      const minY = sceneInsets.top + gap - box.top;
      const maxX = Math.max(minX, window.innerWidth - gap - box.left - box.width);
      const maxY = Math.max(minY, window.innerHeight - sceneInsets.bottom - gap - box.top - box.height);
      return { minX, minY, maxX, maxY };
    }

    function clampPosition(x, y, box) {
      const { minX, minY, maxX, maxY } = positionLimits(box);
      return {
        x: Math.round(clamp(x, minX, maxX)),
        y: Math.round(clamp(y, minY, maxY))
      };
    }

    // Pulls a saved position back on screen (after load or a window resize).
    // A pile moves as one, measured by its top sheet.
    function keepNoteOnScreen(note) {
      const unit = unitOf(note);
      const lead = unit[unit.length - 1];
      const { position } = lead.state;
      if (!position || (press.dragging && drag.unit.includes(lead))) return;
      const next = clampPosition(position.x, position.y, measureWidgetBox(lead));
      if (unit.every((each) => each.state.position && each.state.position.x === next.x && each.state.position.y === next.y)) return;
      unit.forEach((each) => {
        each.state.position = { ...next };
        each.applyPosition();
      });
    }

    // --- Bend simulation ------------------------------------------------------
    function requestMotionFrame() {
      if (!motionFrame) motionFrame = window.requestAnimationFrame(stepMotion);
    }

    function stepSpring(spring, target, { stiffness, damping }) {
      spring.v = (spring.v + (target - spring.x) * stiffness) * damping;
      spring.x += spring.v;
    }

    function stepMotion(now) {
      motionFrame = 0;
      const note = motionNote;
      if (!note) return;
      const c = CONFIG.drag;
      const dragging = press.dragging && press.note === note;

      // Holding still: speed fades, so the paper hangs straight again.
      if (!dragging || now - drag.lastMoveTime > 40) {
        drag.vx *= 0.7;
        drag.vy *= 0.7;
      }

      const bending = dragging && !reducedMotion.matches;
      const swingTarget = bending && !drag.noSwing
        ? clamp(drag.vx * c.swingPerSpeed, -c.maxSwing, c.maxSwing)
        : restingRotation(note);
      const bendYTarget = bending ? clamp(drag.vx * c.bendPerSpeed, -c.maxBend, c.maxBend) : 0;
      const bendXTarget = bending ? clamp(-drag.vy * c.bendPerSpeed, -c.maxBend, c.maxBend) : 0;
      const liftTarget = bending ? 1 : 0;

      stepSpring(springs.swing, swingTarget, c.spring);
      stepSpring(springs.bendY, bendYTarget, c.spring);
      stepSpring(springs.bendX, bendXTarget, c.spring);
      stepSpring(springs.lift, liftTarget, c.liftSpring);

      note.applyPosition();
      if (dragging) {
        drag.unit.forEach((each) => {
          if (each !== note) each.applyPosition();
        });
        trackDropTarget(drag.lastX, drag.lastY, now);
      }
      applyBend(note);

      const targets = { swing: swingTarget, bendX: bendXTarget, bendY: bendYTarget, lift: liftTarget };
      const settled = !dragging && Object.entries(springs).every(
        ([name, spring]) => Math.abs(spring.x - targets[name]) < 0.01 && Math.abs(spring.v) < 0.01
      );
      if (settled) {
        finishMotion();
        return;
      }
      requestMotionFrame();
    }

    // The angle CSS will hold the note at once the drag animation hands back:
    // its tilt on the desktop scene, or straight when focused / no scene.
    function restingRotation(note) {
      const focused = note.el.widget.matches(":focus-within");
      if (note.state.stack) return focused && isInOpenFan(note) ? 0 : visualPlacement(note).tilt;
      if (!SCENE || focused) return 0;
      return visualPlacement(note).tilt;          // 0 for pinned notes
    }

    function applyBend(note) {
      const c = CONFIG.drag;
      const { swing, bendX, bendY, lift } = springs;
      const el = note.el;

      const tiltX = c.liftTilt * lift.x + bendX.x;
      const scale = 1 + c.liftScale * lift.x;
      const transform = `perspective(900px) rotateX(${tiltX.toFixed(2)}deg) rotateY(${bendY.x.toFixed(2)}deg) scale(${scale.toFixed(4)})`;
      if (transform !== appliedBend) {
        appliedBend = transform;
        el.note.style.transform = transform;
      }

      const rotate = `${swing.x.toFixed(2)}deg`;
      if (rotate !== appliedSwing) {
        appliedSwing = rotate;
        el.widget.style.rotate = rotate;
      }

      // Shading follows the bend: brighter where the paper turns toward you.
      el.bendShadeX.style.opacity = Math.min(1, Math.abs(bendY.x) / c.maxBend).toFixed(3);
      el.bendShadeX.style.transform = bendY.x < 0 ? "scaleX(-1)" : "";
      el.bendShadeY.style.opacity = Math.min(1, Math.abs(bendX.x) / c.maxBend).toFixed(3);
      el.bendShadeY.style.transform = bendX.x < 0 ? "scaleY(-1)" : "";
    }

    // Back at rest (or interrupted): hand the note back to CSS.
    function finishMotion() {
      if (motionFrame) {
        window.cancelAnimationFrame(motionFrame);
        motionFrame = 0;
      }
      Object.values(springs).forEach((spring) => {
        spring.x = 0;
        spring.v = 0;
      });
      appliedBend = "";
      appliedSwing = "";

      const note = motionNote;
      motionNote = null;
      if (!note) return;
      const el = note.el;
      el.note.style.transform = "";
      el.widget.style.rotate = "";
      el.widget.style.transformOrigin = "";
      el.bendShadeX.style.opacity = "";
      el.bendShadeX.style.transform = "";
      el.bendShadeY.style.opacity = "";
      el.bendShadeY.style.transform = "";
      el.widget.classList.remove("is-dragging");
    }

    /* ========================================================================
       §JS-11b STACKS + FAN
       Hold a dragged note over another note (or pile) until the ring shows,
       then let go to stack them. A stack is just a
       shared `stack` id; members share one position and their pile order is
       their z order. Click a closed pile to fan it out like a hand of cards
       (`openFan`, not saved). In the fan: hover raises a card, clicking one
       straightens it to read or edit, dragging one out takes it off the
       stack. Clicking elsewhere or Escape gathers the hand back up, with the
       last card you touched on top. Looks: §CSS-17. Numbers: CONFIG.stack.
       ======================================================================== */
    let openFan = null;             // { id, order: [notes], shiftX, shiftY }
    let dropTarget = null;          // note highlighted as "drop here to stack"
    let dropCandidate = null;       // note being hovered, not yet held long enough
    let dropCandidateSince = 0;

    function makeStackId() {
      return `stack-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
    }

    // Members of a stack, bottom of the pile first.
    function stackMembers(id) {
      return notes
        .filter((note) => note.state.stack === id)
        .sort((a, b) => a.state.z - b.state.z);
    }

    // A note's "unit": its whole stack, or just itself.
    function unitOf(note) {
      return note.state.stack ? stackMembers(note.state.stack) : [note];
    }

    function isInOpenFan(note) {
      return Boolean(openFan) && note.state.stack === openFan.id;
    }

    function isClosedStack(note) {
      return Boolean(note.state.stack) && !isInOpenFan(note);
    }

    function noteFromWidget(widget) {
      return notes.find((note) => note.el.widget === widget) || null;
    }

    // Steady pseudo-random -1..1 per note, so a pile looks the same every load.
    function jitter(id, salt = 0) {
      let hash = salt * 7919;
      for (const char of id) hash = (hash * 31 + char.charCodeAt(0)) | 0;
      return ((Math.abs(hash) % 2001) / 1000) - 1;
    }

    // Where a note is drawn: its own spot, a sheet in a pile, or a card in a fan.
    function visualPlacement(note) {
      const { state } = note;
      const base = state.position || { x: 0, y: 0 };
      if (!state.stack) return { x: base.x, y: base.y, tilt: state.pinned ? 0 : state.tilt || 0 };
      const c = CONFIG.stack;

      if (openFan && openFan.id === state.stack) {
        const count = openFan.order.length;
        const index = openFan.order.indexOf(note);
        const fromMiddle = index - (count - 1) / 2;
        const step = count > 1 ? Math.min(c.fanStep, c.fanSpread / (count - 1)) : 0;
        return {
          x: base.x + openFan.shiftX + Math.round(fromMiddle * c.fanGap),
          y: base.y + openFan.shiftY - c.fanLift,
          tilt: Math.round(fromMiddle * step * 10) / 10
        };
      }

      const members = stackMembers(state.stack);
      const depth = members.length - 1 - members.indexOf(note);    // 0 = top sheet
      if (depth === 0) {
        return { x: base.x, y: base.y, tilt: clamp(state.tilt || 0, -c.pileTopTilt, c.pileTopTilt) };
      }
      return {
        x: base.x + Math.round(jitter(state.id) * c.pileJitter),
        y: base.y + depth * c.pileStep,
        tilt: Math.round(jitter(state.id, 7) * c.pileTilt * 10) / 10
      };
    }

    function layoutStack(id) {
      stackMembers(id).forEach((note) => note.applyStackState());
    }

    // Puts `unit` (a note, or a whole pile) on top of `target`'s note or pile.
    function stackOnto(unit, target) {
      const targetUnit = unitOf(target);
      const id = target.state.stack || makeStackId();
      const lead = targetUnit[targetUnit.length - 1];
      const anchor = { ...(lead.state.position || { x: 0, y: 0 }) };
      if (openFan && openFan.id === id) closeFan();
      const oldIds = new Set(unit.map((note) => note.state.stack).filter((old) => old && old !== id));

      targetUnit.forEach((note) => {
        note.state.stack = id;
        note.state.position = { ...anchor };
      });
      [...unit]
        .sort((a, b) => a.state.z - b.state.z)
        .forEach((note) => {
          note.state.stack = id;
          note.state.position = { ...anchor };
          bringToFront(note);        // dropped sheets land on top, in order
        });
      oldIds.forEach(cleanupStack);
      layoutStack(id);
      activeNote = unit[unit.length - 1];
      saveSettings();
    }

    // Takes one note out of its stack, leaving it exactly where it's drawn.
    function detachFromStack(note) {
      const id = note.state.stack;
      if (!id) return;
      const placement = visualPlacement(note);
      note.state.stack = null;
      note.state.position = { x: placement.x, y: placement.y };
      if (openFan && openFan.id === id) {
        openFan.order = openFan.order.filter((card) => card !== note);
      }
      note.applyStackState();
      cleanupStack(id);
    }

    // A stack with fewer than two notes stops being a stack.
    function cleanupStack(id) {
      const members = stackMembers(id);
      if (members.length >= 2) {
        layoutStack(id);
        return;
      }
      if (openFan && openFan.id === id) openFan = null;
      members.forEach((note) => {
        note.state.stack = null;
        note.applyStackState();
      });
    }

    // Fans a pile out, nudged sideways / down if the hand would leave the screen.
    function openFanFor(note) {
      const id = note.state.stack;
      if (!id || (openFan && openFan.id === id)) return;
      closeFan();
      closeMenus();
      hideFormatBubble();

      const members = stackMembers(id);
      const lead = members[members.length - 1];
      const box = measureWidgetBox(lead);
      const base = lead.state.position || { x: 0, y: 0 };
      const c = CONFIG.stack;
      const count = members.length;
      const step = count > 1 ? Math.min(c.fanStep, c.fanSpread / (count - 1)) : 0;
      const halfAngle = ((step * (count - 1)) / 2) * (Math.PI / 180);
      const reach = box.height * c.pivot * Math.sin(halfAngle) + (c.fanGap * (count - 1)) / 2;
      const left = box.left + base.x - reach;
      const right = box.left + base.x + box.width + reach;
      const gap = 8;

      let shiftX = 0;
      if (right - left > window.innerWidth - gap * 2) shiftX = window.innerWidth / 2 - (left + right) / 2;
      else if (left < gap) shiftX = gap - left;
      else if (right > window.innerWidth - gap) shiftX = window.innerWidth - gap - right;
      // Tilted cards lift one top corner; a hovered card rises a little more.
      const cornerRise = (box.width / 2) * Math.sin(halfAngle) - box.height * c.pivot * (1 - Math.cos(halfAngle));
      const handTop = box.top + base.y - c.fanLift - Math.max(0, cornerRise) - c.fanRaise;
      const minTop = sceneInsets.top + gap;
      const shiftY = handTop < minTop ? minTop - handTop : 0;

      openFan = { id, order: members, shiftX: Math.round(shiftX), shiftY: Math.round(shiftY) };
      layoutStack(id);
    }

    function closeFan() {
      if (!openFan) return;
      const { id } = openFan;
      openFan = null;
      const focused = document.activeElement;
      if (focused && stackMembers(id).some((note) => note.el.widget.contains(focused))) focused.blur();
      layoutStack(id);
    }

    // Which note (other than the ones being dragged) is under the pointer?
    function findDropTarget(x, y) {
      for (const hit of document.elementsFromPoint(x, y)) {
        const widget = hit.closest ? hit.closest(".board .widget") : null;
        if (!widget || widget.classList.contains("is-leaving")) continue;
        const note = noteFromWidget(widget);
        if (!note || drag.unit.includes(note)) continue;
        return note.state.pinned ? null : note;    // pinned notes don't stack
      }
      return null;
    }

    // The note that stands for a drop target: the top of a closed pile, or
    // the note itself.
    function dropFace(note) {
      if (!note || !isClosedStack(note)) return note;
      const members = stackMembers(note.state.stack);
      return members[members.length - 1];
    }

    // Called every frame while dragging. A note under the pointer only becomes
    // the drop target once the pointer has rested over it (barely moving) for
    // CONFIG.stack.dropDelayMs, so nudging, or dragging across overlapping
    // notes on a small screen, never stacks them by accident.
    function trackDropTarget(x, y, now) {
      const draggingPinned = drag.unit.some((note) => note.state.pinned);
      const face = draggingPinned ? null : dropFace(findDropTarget(x, y));
      const moving = Math.hypot(drag.vx, drag.vy) > CONFIG.stack.dropHoldSpeed;
      if (face !== dropCandidate || moving) {
        dropCandidate = face;
        dropCandidateSince = now;
        setDropTarget(null);
        return;
      }
      if (face && now - dropCandidateSince >= CONFIG.stack.dropDelayMs) setDropTarget(face);
    }

    function clearDropTracking() {
      dropCandidate = null;
      setDropTarget(null);
    }

    // Highlights the armed drop target (shows the ring).
    function setDropTarget(note) {
      const shown = dropFace(note);
      if (shown === dropTarget) return;
      if (dropTarget) dropTarget.el.widget.classList.remove("is-drop-target");
      dropTarget = shown;
      if (dropTarget) dropTarget.el.widget.classList.add("is-drop-target");
    }

    // Repairs saved stacks: drops one-note stacks, lines piles up on one spot.
    function tidyStacksOnLoad() {
      const ids = new Set(notes.map((note) => note.state.stack).filter(Boolean));
      ids.forEach((id) => {
        const members = stackMembers(id);
        if (members.length < 2) {
          members.forEach((note) => { note.state.stack = null; });
          return;
        }
        const anchor = members[members.length - 1].state.position || { x: 0, y: 0 };
        members.forEach((note) => {
          note.state.position = { ...anchor };
          note.state.pinned = false;               // pinned notes don't stack
        });
      });
    }

    /* ========================================================================
       §JS-12 GLOBAL EVENT WIRING
       Listeners shared by all notes. Each note wires its own controls in
       Note.bindEvents() (§JS-5).
       ======================================================================== */
    function bindGlobalEvents() {
      // --- Add note (floating + button) ---
      bindControl(shared.addNoteBtn, () => addNote());
      bindControl(shared.scatterBtn, () => scatterNotes());
      bindPaletteEvents();
      bindToastEvents();
      document.addEventListener("keydown", handleUndoKeys, true);
      bindControl(shared.saveStatus, () => showSaveWarning());
      shared.backupInput.addEventListener("change", () => restoreBackupFile(shared.backupInput.files[0]));

      // --- Format bubble ---
      shared.formatBubble.addEventListener("mousedown", holdControl);
      shared.formatBubble.querySelectorAll("[data-bubble-format]").forEach((button) => {
        bindControl(button, () => bubbleNote()?.format(button.dataset.bubbleFormat));
      });
      shared.formatBubble.querySelectorAll("[data-highlight]").forEach((button) => {
        bindControl(button, () => bubbleNote()?.highlight(button.dataset.highlight));
      });

      // --- Selection + paste ---
      document.addEventListener("selectionchange", scheduleSelectionCheck);
      document.addEventListener("paste", handlePasteImage);

      // --- Close an open fan when pressing anywhere outside it ---
      document.addEventListener("pointerdown", (event) => {
        if (!openFan) return;
        const widget = event.target.closest ? event.target.closest(".board .widget") : null;
        const note = widget ? noteFromWidget(widget) : null;
        if (note && note.state.stack === openFan.id) return;
        if (shared.formatBubble.contains(event.target)) return;
        closeFan();
      }, true);

      // --- Close menus / bubble ---
      document.addEventListener("click", (event) => {
        // Clicks inside the open menu (slider, labels, dividers) keep it open;
        // menu items that should close it do so themselves.
        // (The menu's own area, including its button, doesn't count as outside.)
        if (!openMenuNote || !openMenuNote.el.menu.parentElement.contains(event.target)) closeMenus();
        if (!noteFromNode(event.target) && !shared.formatBubble.contains(event.target)) {
          hideFormatBubble();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (openMenuNote) closeMenus();
          else closeFan();
          hideFormatBubble();
        }
      });

      // --- Window ---
      window.addEventListener("blur", () => endPress());
      let onScreenFrame = 0;
      window.addEventListener("resize", () => {
        if (onScreenFrame) return;
        onScreenFrame = window.requestAnimationFrame(() => {
          onScreenFrame = 0;
          measureSceneInsets();
          notes.forEach(keepNoteOnScreen);
          scheduleAmbient();
        });
      });

      // --- Save anything still debounced before the page goes away ---
      window.addEventListener("pagehide", flushPendingSave);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") flushPendingSave();
      });
    }

    /* ========================================================================
       §JS-12b DESKTOP SCENE (menu bar)
       The clock wakes once a minute, on the minute.
       ======================================================================== */
    const clockDateFormat = new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short" });
    const clockTimeFormat = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });

    function updateSceneBar() {
      if (!SCENE) return;
      const pinned = notes.filter((note) => note.state.pinned).length;
      setText(shared.sceneCount, `${notes.length} ${notes.length === 1 ? "note" : "notes"}${pinned ? ` · ${pinned} pinned` : ""}`);
    }

    function tickClock() {
      const now = new Date();
      setText(shared.sceneClock, `${clockDateFormat.format(now)}  ${clockTimeFormat.format(now)}`);
      shared.sceneClock.dateTime = now.toISOString();
      window.setTimeout(tickClock, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 50);
    }

    function startScene() {
      document.documentElement.classList.add("scene-desktop");
      if (BOARD_ID !== "default") setText(shared.sceneTitle, BOARD_ID.replace(/[-_]+/g, " "));
      tickClock();
      measureSceneInsets();
    }

    /* ========================================================================
       §JS-12c AMBIENT WASH
       Moves the desk-wide colour wash (§CSS-18) to the active note and tints
       it with that note's glow colour. Runs only when something changes
       (activate, drop, theme, scatter, add/remove, resize), once per frame at
       most, and only writes when the target actually changed. CSS does the
       slow drift and colour fade.
       ======================================================================== */
    let ambientFrame = 0;
    let appliedWash = { transform: "", color: "" };

    function scheduleAmbient() {
      if (!SCENE || ambientFrame) return;
      ambientFrame = window.requestAnimationFrame(() => {
        ambientFrame = 0;
        updateAmbient();
      });
    }

    function updateAmbient() {
      const note = activeNote && notes.includes(activeNote) ? activeNote : topmostNote();
      if (!note) return;
      const face = dropFace(note) || note;           // a pile glows from its top sheet
      const box = measureWidgetBox(face);
      const placement = visualPlacement(face);
      const x = Math.round(box.left + placement.x + box.width / 2);
      const y = Math.round(box.top + placement.y + box.height / 2);
      const transform = `translate(${x}px, ${y}px)`;
      const color = getComputedStyle(face.el.widget).getPropertyValue("--glow-color").trim();

      const wash = shared.ambientWash;
      if (transform !== appliedWash.transform) {
        appliedWash.transform = transform;
        wash.style.transform = transform;
      }
      if (color && color !== appliedWash.color) {
        appliedWash.color = color;
        wash.style.setProperty("--wash-color", color);
      }
    }

    /* ========================================================================
       §JS-12d SEARCH PALETTE
       Spotlight-style search over every note's title and text, plus quick
       actions. Open: ⌘K / Ctrl K anywhere, "/" when not typing, or the search
       buttons. ↑/↓ move, ↵ opens, ⌘↵ / Ctrl ↵ makes a new note from what you
       typed, esc closes. All words must match (in any order); title matches
       rank above text matches, and recently touched notes break ties.
       Opening a note brings it forward (fanning its pile if it's in one),
       selects the matching text and flashes the note.
       To add an action: add an entry to paletteActions() below.
       ======================================================================== */
    const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
    const paletteState = { open: false, items: [], index: 0, returnFocus: null, closeTimer: 0 };
    const searchCache = new WeakMap();          // note -> { html, text, lines, done, total }

    const ACTION_ICONS = {
      new: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
      scatter: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><rect x="1.6" y="2.4" width="6" height="6" rx="1.2" transform="rotate(-10 4.6 5.4)"/><rect x="8.6" y="1.8" width="5.4" height="5.4" rx="1.2" transform="rotate(8 11.3 4.5)"/><rect x="5" y="8.4" width="6" height="6" rx="1.2" transform="rotate(4 8 11.4)"/></svg>',
      colour: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" stroke-linecap="round"/></svg>',
      download: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7.5M5 7l3 3 3-3"/><path d="M3 11v1.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V11"/></svg>',
      upload: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2.5M5 5.5l3-3 3 3"/><path d="M3 11v1.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V11"/></svg>',
      pin: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M6 2.2h4l-.6 4 2.4 2.3H4.2L6.6 6.2 6 2.2Z"/><path d="M8 8.5v5.3"/></svg>'
    };

    // Plain text of a note (cached until its HTML changes).
    function searchableText(note) {
      if (note.bodyDirty) note.syncBody();
      const html = note.state.bodyHtml || "";
      const cached = searchCache.get(note);
      if (cached && cached.html === html) return cached;

      const template = document.createElement("template");
      template.innerHTML = html;
      const boxes = template.content.querySelectorAll('input[type="checkbox"]');
      const lines = [];
      template.content.childNodes.forEach((node) => {
        const text = (node.textContent || "").replace(/\s+/g, " ").trim();
        if (text) lines.push(text);
      });
      const entry = {
        html,
        lines,
        text: lines.join(" · "),
        total: boxes.length,
        done: [...boxes].filter((box) => box.hasAttribute("checked")).length
      };
      searchCache.set(note, entry);
      return entry;
    }

    function searchTerms(query) {
      return query.toLowerCase().split(/\s+/).filter(Boolean);
    }

    function startsWord(text, index) {
      return index === 0 || /[\s·\-_/(]/.test(text[index - 1]);
    }

    // Score a note for the query, or -1 if any word is missing.
    function scoreNote(note, terms) {
      const title = (note.state.title || "").toLowerCase();
      const text = searchableText(note).text.toLowerCase();
      let score = 0;
      for (const term of terms) {
        const inTitle = title.indexOf(term);
        const inText = text.indexOf(term);
        if (inTitle < 0 && inText < 0) return -1;
        if (inTitle >= 0) score += startsWord(title, inTitle) ? 30 : 18;
        if (inText >= 0) score += startsWord(text, inText) ? 12 : 7;
      }
      return score;
    }

    // Escaped text with every search word wrapped in <mark>.
    function highlight(text, terms) {
      if (!terms.length) return escapeHtml(text);
      const lower = text.toLowerCase();
      const marks = new Array(text.length).fill(false);
      terms.forEach((term) => {
        let at = lower.indexOf(term);
        while (at >= 0) {
          for (let i = at; i < at + term.length; i += 1) marks[i] = true;
          at = lower.indexOf(term, at + term.length);
        }
      });
      let out = "";
      let open = false;
      for (let i = 0; i < text.length; i += 1) {
        if (marks[i] && !open) { out += "<mark>"; open = true; }
        if (!marks[i] && open) { out += "</mark>"; open = false; }
        out += escapeHtml(text[i]);
      }
      return open ? `${out}</mark>` : out;
    }

    // A short window of the note's text around the first match.
    function snippetFor(text, terms) {
      if (!text) return "empty note";
      const lower = text.toLowerCase();
      const hits = terms.map((term) => lower.indexOf(term)).filter((at) => at >= 0);
      const first = hits.length ? Math.min(...hits) : 0;
      const start = Math.max(0, first - 24);
      const cut = text.slice(start, start + 110);
      return `${start > 0 ? "…" : ""}${cut}${start + 110 < text.length ? "…" : ""}`;
    }

    function paletteActions(query) {
      const target = activeNote && notes.includes(activeNote) ? activeNote : topmostNote();
      const typed = query.trim();
      const actions = [];
      actions.push({
        kind: "action",
        icon: "new",
        title: typed ? `New note: “${typed}”` : "New note",
        keywords: "new note add create",
        alwaysShow: Boolean(typed),
        run: () => addNoteWithText(typed)
      });
      if (SCENE) {
        actions.push({ kind: "action", icon: "scatter", title: "Scatter notes", keywords: "scatter shuffle spread desk", run: () => scatterNotes() });
      }
      actions.push({
        kind: "action", icon: "download", title: "Download a backup",
        keywords: "backup export save download file", onlyWhenTyped: true,
        run: () => downloadBackup()
      });
      actions.push({
        kind: "action", icon: "upload", title: "Restore from a backup…",
        keywords: "backup import restore load open file", onlyWhenTyped: true,
        run: () => chooseBackupFile()
      });
      if (target) {
        const name = target.state.title || CONFIG.defaultTitle;
        actions.push({
          kind: "action",
          icon: "pin",
          title: target.state.pinned ? `Unpin “${name}”` : `Pin “${name}” on top`,
          keywords: "pin unpin top keep important always above",
          onlyWhenTyped: true,
          run: () => target.togglePin()
        });
        ["rose", "butter", "sage", "mist"]
          .filter((theme) => theme !== target.state.theme)
          .forEach((theme) => actions.push({
            kind: "action",
            icon: "colour",
            title: `Make “${target.state.title || CONFIG.defaultTitle}” ${theme}`,
            keywords: `colour color theme ${theme}`,
            onlyWhenTyped: true,
            run: () => target.setTheme(theme)
          }));
      }
      const terms = searchTerms(typed);
      const shown = actions.filter((action) => action.alwaysShow
        || !terms.length && !action.onlyWhenTyped
        || terms.length && terms.every((term) => `${action.title} ${action.keywords}`.toLowerCase().includes(term)));
      // Actions that match what you typed come first; "New note: …" is the
      // fallback, so it goes last (⌘↵ / Ctrl ↵ always picks it).
      if (typed) shown.push(shown.shift());
      return shown;
    }

    function addNoteWithText(text) {
      addNote();
      const note = activeNote;
      if (!text || !note) return;
      note.el.noteBody.innerHTML = `<div>${escapeHtml(text)}</div>`;
      saveState(note);
      note.render();
      focusEditableEnd(note.el.noteBody);
    }

    // --- Open / close ----------------------------------------------------------
    function openPalette() {
      if (paletteState.open) {
        shared.paletteInput.select();
        return;
      }
      if (press.active) endPress();
      closeMenus();
      hideFormatBubble();
      window.clearTimeout(paletteState.closeTimer);
      paletteState.open = true;
      paletteState.returnFocus = document.activeElement;
      shared.palette.hidden = false;
      document.body.classList.add("palette-open");
      shared.paletteInput.value = "";
      updatePalette();
      shared.paletteInput.focus();
      window.requestAnimationFrame(() => shared.palette.classList.add("is-open"));
    }

    function closePalette({ restoreFocus = true } = {}) {
      if (!paletteState.open) return;
      paletteState.open = false;
      shared.palette.classList.remove("is-open");
      document.body.classList.remove("palette-open");
      notes.forEach((note) => note.el.widget.classList.remove("is-search-miss", "is-search-pick"));
      paletteState.closeTimer = window.setTimeout(() => {
        shared.palette.hidden = true;
      }, reducedMotion.matches ? 0 : 180);
      const back = paletteState.returnFocus;
      paletteState.returnFocus = null;
      if (restoreFocus && back && back.isConnected && back !== document.body) back.focus();
      else shared.paletteInput.blur();
    }

    // --- Results ---------------------------------------------------------------
    function updatePalette() {
      const query = shared.paletteInput.value;
      const terms = searchTerms(query);

      const ranked = notes
        .map((note) => ({ note, score: terms.length ? scoreNote(note, terms) : 0 }))
        .filter((entry) => entry.score >= 0)
        .sort((a, b) => b.score - a.score
          || Number(b.note.state.pinned) - Number(a.note.state.pinned)     // pinned first
          || effectiveZ(b.note) - effectiveZ(a.note));
      const matched = new Set(ranked.map((entry) => entry.note));

      const noteItems = ranked.slice(0, 8).map(({ note }) => ({ kind: "note", note, run: () => openNoteFromSearch(note, terms) }));
      const actionItems = paletteActions(query);
      paletteState.items = [...noteItems, ...actionItems];
      paletteState.index = 0;

      // Desk behind: matches stay bright, the rest fade back.
      notes.forEach((note) => note.el.widget.classList.toggle("is-search-miss", terms.length > 0 && !matched.has(note)));

      let html = "";
      if (noteItems.length) {
        html += '<div class="palette-section" role="presentation">Notes</div>';
        noteItems.forEach((item, index) => { html += noteResultHtml(item.note, terms, index); });
      } else if (terms.length) {
        html += `<div class="palette-empty">No notes match “${escapeHtml(query.trim())}”</div>`;
      }
      if (actionItems.length) {
        html += '<div class="palette-section" role="presentation">Actions</div>';
        actionItems.forEach((item, index) => { html += actionResultHtml(item, terms, noteItems.length + index); });
      }
      shared.paletteList.innerHTML = html;
      selectPaletteItem(0);
    }

    function noteResultHtml(note, terms, index) {
      const entry = searchableText(note);
      const meta = [];
      if (entry.total) meta.push(`${entry.done} of ${entry.total} done`);
      if (note.state.pinned) meta.push("pinned");
      if (note.state.stack) meta.push(`in a stack of ${stackMembers(note.state.stack).length}`);
      return `<div class="palette-item" role="option" id="palette-item-${index}" data-index="${index}">
          <span class="palette-dot theme-${escapeAttribute(note.state.theme)}" aria-hidden="true"></span>
          <span class="palette-text">
            <span class="palette-title">${highlight(note.state.title || CONFIG.defaultTitle, terms)}</span>
            <span class="palette-snippet">${highlight(snippetFor(entry.text, terms), terms)}</span>
          </span>
          <span class="palette-meta">${escapeHtml(meta.join(" · "))}</span>
        </div>`;
    }

    function actionResultHtml(item, terms, index) {
      return `<div class="palette-item" role="option" id="palette-item-${index}" data-index="${index}">
          <span class="palette-icon" aria-hidden="true">${ACTION_ICONS[item.icon] || ""}</span>
          <span class="palette-text"><span class="palette-title">${highlight(item.title, terms)}</span></span>
        </div>`;
    }

    function selectPaletteItem(index) {
      const count = paletteState.items.length;
      if (!count) {
        shared.paletteInput.removeAttribute("aria-activedescendant");
        notes.forEach((note) => note.el.widget.classList.remove("is-search-pick"));
        return;
      }
      paletteState.index = (index + count) % count;
      shared.paletteList.querySelectorAll(".palette-item").forEach((row) => {
        const selected = Number(row.dataset.index) === paletteState.index;
        row.classList.toggle("is-selected", selected);
        row.setAttribute("aria-selected", String(selected));
        if (selected) row.scrollIntoView({ block: "nearest" });
      });
      shared.paletteInput.setAttribute("aria-activedescendant", `palette-item-${paletteState.index}`);
      const picked = paletteState.items[paletteState.index];
      notes.forEach((note) => note.el.widget.classList.toggle("is-search-pick", picked.kind === "note" && picked.note === note));
    }

    function runPaletteItem(index) {
      const item = paletteState.items[index];
      if (!item) return;
      closePalette({ restoreFocus: false });
      item.run();
    }

    // --- Opening a note --------------------------------------------------------
    function openNoteFromSearch(note, terms) {
      if (!notes.includes(note)) return;
      if (note.state.collapsed) {
        note.state.collapsed = false;
        note.render();
        saveSettings();
      }
      if (note.state.stack && isClosedStack(note)) {
        openFanFor(note);           // fan the pile and pick this card
        bringToFront(note);
        activeNote = note;
        scheduleAmbient();
      } else {
        activateNote(note, { toFront: true });
      }
      keepNoteOnScreen(note);

      if (!selectMatchInNote(note, terms)) focusEditableEnd(note.el.noteBody);

      const widget = note.el.widget;
      widget.classList.remove("is-found");
      void widget.offsetWidth;      // restart the flash if it's already running
      widget.classList.add("is-found");
      window.setTimeout(() => widget.classList.remove("is-found"), 1200);
    }

    // Selects the first match in the note's text and scrolls it into view.
    function selectMatchInNote(note, terms) {
      if (!terms.length) return false;
      const body = note.el.noteBody;
      const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
      let best = null;
      for (let node = walker.nextNode(); node; node = walker.nextNode()) {
        const lower = node.data.toLowerCase();
        for (const term of terms) {
          const at = lower.indexOf(term);
          if (at >= 0) { best = { node, at, length: term.length }; break; }
        }
        if (best) break;
      }
      if (!best) return false;
      body.focus({ preventScroll: true });
      const range = document.createRange();
      range.setStart(best.node, best.at);
      range.setEnd(best.node, best.at + best.length);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      const content = body.parentElement;
      const rect = range.getBoundingClientRect();
      const box = content.getBoundingClientRect();
      if (rect.top < box.top + 8 || rect.bottom > box.bottom - 40) {
        content.scrollTop += rect.top - box.top - box.height / 3;
      }
      return true;
    }

    // --- Events ----------------------------------------------------------------
    function bindPaletteEvents() {
      const shortcut = IS_MAC ? "⌘K" : "Ctrl K";
      document.querySelectorAll("[data-shortcut-label]").forEach((el) => { el.textContent = shortcut; });
      document.querySelectorAll("[data-shortcut-mod]").forEach((el) => { el.textContent = IS_MAC ? "⌘" : "Ctrl"; });
      shared.searchBtn.title = `Search (${shortcut})`;

      bindControl(shared.searchBtn, () => openPalette());
      bindControl(shared.sceneSearchBtn, () => openPalette());

      // ⌘K / Ctrl K anywhere; "/" when not typing somewhere.
      document.addEventListener("keydown", (event) => {
        const mod = IS_MAC ? event.metaKey : event.ctrlKey;
        if (mod && !event.shiftKey && !event.altKey && event.key.toLowerCase() === "k") {
          event.preventDefault();
          if (paletteState.open) closePalette();
          else openPalette();
          return;
        }
        if (event.key === "/" && !paletteState.open && !isTypingTarget(event.target)) {
          event.preventDefault();
          openPalette();
        }
      }, true);

      shared.paletteInput.addEventListener("input", updatePalette);
      shared.paletteInput.addEventListener("keydown", (event) => {
        const mod = IS_MAC ? event.metaKey : event.ctrlKey;
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          selectPaletteItem(paletteState.index + (event.key === "ArrowDown" ? 1 : -1));
        } else if (event.key === "Enter" && mod) {
          event.preventDefault();
          const text = shared.paletteInput.value.trim();
          closePalette({ restoreFocus: false });
          addNoteWithText(text);
        } else if (event.key === "Enter") {
          event.preventDefault();
          runPaletteItem(paletteState.index);
        } else if (event.key === "Escape") {
          event.preventDefault();
          event.stopPropagation();          // don't also close fans / menus behind
          if (shared.paletteInput.value) {
            shared.paletteInput.value = "";
            updatePalette();
          } else {
            closePalette();
          }
        } else if (event.key === "Tab") {
          event.preventDefault();           // keep focus in the palette
          selectPaletteItem(paletteState.index + (event.shiftKey ? -1 : 1));
        }
      });

      // Mouse: hover selects, click runs; never steal focus from the field.
      shared.paletteList.addEventListener("mousedown", (event) => event.preventDefault());
      shared.paletteList.addEventListener("pointermove", (event) => {
        const row = event.target.closest(".palette-item");
        if (row && Number(row.dataset.index) !== paletteState.index) selectPaletteItem(Number(row.dataset.index));
      });
      shared.paletteList.addEventListener("click", (event) => {
        const row = event.target.closest(".palette-item");
        if (row) runPaletteItem(Number(row.dataset.index));
      });
      shared.palette.querySelector("[data-palette-close]").addEventListener("pointerdown", (event) => {
        event.preventDefault();
        closePalette();
      });
    }

    function isTypingTarget(target) {
      return Boolean(target && target.closest && target.closest('input, textarea, select, [contenteditable="true"]'));
    }

    /* ========================================================================
       §JS-13 INIT
       ======================================================================== */
    function init() {
      document.body.classList.toggle("no-resize", !ALLOW_RESIZE);
      if (SCENE) startScene();
      else measureSceneInsets();          // sets the tallest-note limit
      loadBoard().forEach((state) => notes.push(new Note(state)));
      tidyStacksOnLoad();
      normalizeZ();
      notes.forEach((note) => note.render());   // second pass: knows how many notes exist
      if (SCENE && isFreshBoard) scatterNotes({ record: false });  // first visit: spread the starter notes out
      notes.forEach(keepNoteOnScreen);
      activeNote = topmostNote();
      updateSceneBar();
      if (SCENE) updateAmbient();       // place the wash before first paint (no drift-in)
      bindGlobalEvents();
      // Enable the position glide only after the first paint, so saved
      // positions don't slide in on load.
      window.requestAnimationFrame(() => {
        notes.forEach((note) => note.el.widget.classList.add("is-ready"));
      });
      window.setTimeout(shrinkSavedImages, 800);
    }

    init();
</script>
</body>
